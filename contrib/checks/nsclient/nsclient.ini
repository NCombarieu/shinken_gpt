; NSClient++ (Windows) for Shinken over NRPE -- doc/checks/nrpe.md
; C:\Program Files\NSClient++\nsclient.ini, then: net stop nscp && net start nscp
;
; Principle: Shinken only sends an alias NAME (check_nrpe!alias_cpu);
; thresholds and filters live here. "allow arguments" stays off.

; NSClient++ does not support comments at the end of a value line: keep
; every comment on its own line.
[/modules]
; check_cpu, check_memory, check_service, check_uptime, check_pdh
CheckSystem = enabled
; check_drivesize
CheckDisk = enabled
; check_eventlog
CheckEventLog = enabled
; aliases and PowerShell scripts below
CheckExternalScripts = enabled
NRPEServer = enabled

[/settings/default]
; Address of the Podman host running Shinken, as seen by this server.
allowed hosts = 192.0.2.10

[/settings/NRPE/server]
port = 5666
use ssl = true
insecure = false
; Mutual TLS: this agent's certificate, and the CA that signed Shinken's
; client certificate (check_nrpe_ssl).
certificate = ${certificate-path}\nrpe-server.crt
certificate key = ${certificate-path}\nrpe-server.key
ca = ${certificate-path}\ca.crt
verify mode = peer-cert
allow arguments = false
allow nasty characters = false

[/settings/external scripts]
allow arguments = false
allow nasty characters = false
; below Shinken's check_nrpe -t 30
timeout = 25

; --- Option 1: aliases on built-in checks ---------------------------------
; Note: thresholds use gt/lt (never > <, which are "nasty characters").
[/settings/external scripts/alias]
alias_cpu      = check_cpu "warn=load gt 80" "crit=load gt 90"
alias_mem      = check_memory "type=physical" "warn=used gt 85%" "crit=used gt 95%"
alias_disk     = check_drivesize "drive=*" "filter=type in ('fixed')" "warn=used gt 85%" "crit=used gt 95%"
alias_disk_c   = check_drivesize "drive=C:" "warn=used gt 85%" "crit=used gt 95%"
alias_services = check_service "filter=start_type = 'auto'" "exclude=sppsvc" "exclude=edgeupdate" "exclude=gupdate"
alias_spooler  = check_service "service=Spooler"
alias_uptime   = check_uptime "warn=uptime lt 600" "crit=uptime lt 300"
alias_evt_sys  = check_eventlog "file=System" "filter=level in ('error','critical')" "scan-range=-1h" "warn=count gt 0" "crit=count gt 5"

; --- Option 2: custom PowerShell scripts ----------------------------------
; Scripts go in C:\Program Files\NSClient++\scripts\ ; they print one line
; and exit with 0/1/2/3 (see check_example.ps1). The wrapping is defined
; explicitly so the script runs whatever the machine's execution policy is.
[/settings/external scripts/wrappings]
ps1 = cmd /c echo scripts\\%SCRIPT% %ARGS%; exit($lastexitcode) | powershell.exe -NoProfile -ExecutionPolicy Bypass -command -

[/settings/external scripts/wrapped scripts]
; name used by Shinken = script file + FIXED arguments (allowed even with
; "allow arguments = false", because they are written here, not sent).
check_backup = check_example.ps1 -MaxAgeHours 26
