# /etc/nagios/nrpe.d/shinken.cfg  (Debian/Ubuntu: nagios-nrpe-server)
# See doc/checks/nrpe.md. Restart: systemctl restart nagios-nrpe-server
#
# Only the Shinken poller may connect (address of the Podman host as seen
# by the target).
allowed_hosts=127.0.0.1,192.0.2.10

# Keep arguments off: thresholds are fixed here, Shinken only sends a name.
dont_blame_nrpe=0
allow_bash_command_substitution=0

# TLS. With ssl_client_certs=2 only a client presenting a certificate signed
# by ca.crt (Shinken's check_nrpe_ssl) is accepted.
ssl_version=TLSv1.2+
ssl_cacert_file=/etc/nagios/ssl/ca.crt
ssl_cert_file=/etc/nagios/ssl/nrpe-server.crt
ssl_privatekey_file=/etc/nagios/ssl/nrpe-server.key
ssl_client_certs=2

command[check_load]=/usr/lib/nagios/plugins/check_load -r -w 2,1.5,1.2 -c 4,3,2
command[check_disk]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -X tmpfs -X devtmpfs -X overlay -X squashfs
command[check_root]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
command[check_swap]=/usr/lib/nagios/plugins/check_swap -w 50% -c 20%
command[check_procs]=/usr/lib/nagios/plugins/check_procs -w 400 -c 600
command[check_zombies]=/usr/lib/nagios/plugins/check_procs -s Z -w 5 -c 20
command[check_sshd]=/usr/lib/nagios/plugins/check_procs -c 1: -C sshd
