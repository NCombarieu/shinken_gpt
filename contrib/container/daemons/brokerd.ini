# brokerd.ini — version conteneur : avant-plan, journaux sur la sortie standard,
# écoute sur toutes les interfaces du conteneur (le réseau Podman l'isole).
[daemon]
workdir = /var/run/shinken
logdir  = /var/log/shinken
pidfile=%(workdir)s/brokerd.pid
host=0.0.0.0
port=7772
user=shinken
group=shinken
daemon_enabled=1
use_ssl=0
http_backend=auto
daemon_thread_pool_size=16
use_local_log=0
log_level=WARNING
max_queue_size=100000
modules_dir=/var/lib/shinken/modules
