# Module broker Livestatus : la seule interface que Thruk sait interroger.
#
# ATTENTION : le module officiel (shinken-monitoring/mod-livestatus) est écrit
# pour Python 2. Il n'est PAS fourni par ce dépôt et ne tourne pas tel quel dans
# l'image Python 3. Voir la fiche « Architecture de la pile conteneurisée » du
# portail documentaire, section « Point bloquant : Livestatus ».
#
# Déposer le module porté dans /var/lib/shinken/modules/livestatus/ (volume
# `modules` du conteneur shinken-broker) avant d'activer ce bloc.
define module {
    module_name     livestatus
    module_type     livestatus
    host            0.0.0.0         ; écoute dans le conteneur, réseau Podman uniquement
    port            50000
    ; socket        /var/lib/shinken/live   ; variante socket Unix, inutile ici
    database_file   /var/lib/shinken/livestatus.db
    ; use_aggressive_sql 1
}
