define poller {
    poller_name         poller-master
    address             poller
    port                7771
    spare               0
    manage_sub_realms   0
    min_workers         0
    max_workers         0
    processes_by_worker 256
    polling_interval    1
    timeout             3
    data_timeout        120
    max_check_attempts  3
    check_interval      60
    modules
    use_ssl             0
    hard_ssl_name_check 0
    realm               All
    ; Pour un poller déporté dans une autre zone réseau, dupliquer ce bloc
    ; avec un autre poller_name, l'adresse du nœud distant et un poller_tag.
    ; poller_tags        dmz
}
