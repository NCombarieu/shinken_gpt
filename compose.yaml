name: shinken

x-shinken: &shinken
  build:
    context: .
    dockerfile: Containerfile
  image: localhost/shinken:dev
  restart: unless-stopped
  environment:
    SHINKEN_CONTAINER_DNS: "1"
    SHINKEN_STATUS_WEBUI: "1"
    SHINKEN_MODULES_DIR: /usr/local/lib/shinken/modules
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - ./etc:/etc/shinken:ro,Z
    - shinken-data:/var/lib/shinken:Z
    - shinken-logs:/var/log/shinken:Z

services:
  arbiter:
    <<: *shinken
    command: ["arbiter"]
    depends_on:
      - scheduler
      - poller
      - reactionner
      - broker
      - receiver

  scheduler:
    <<: *shinken
    command: ["scheduler"]

  poller:
    <<: *shinken
    command: ["poller"]
    cap_add:
      - NET_RAW

  reactionner:
    <<: *shinken
    command: ["reactionner"]

  broker:
    <<: *shinken
    command: ["broker"]
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:50000:50000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  receiver:
    <<: *shinken
    command: ["receiver"]

  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      INFLUXDB_DB: shinken
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: shinkenpass
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - influxdb-data:/var/lib/influxdb2:Z
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://127.0.0.1:8086/api/v1/ping"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana:Z
      - ./etc/grafana/provisioning:/etc/grafana/provisioning:ro,Z
    depends_on:
      - influxdb
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://127.0.0.1:3000/api/health"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  shinken-data:
  shinken-logs:
  influxdb-data:
  grafana-data:
