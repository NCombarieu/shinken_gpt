define command {
    command_name check_dummy
    command_line $USER1$/check_dummy $ARG1$ "Native monitoring example"
}
define host {
    name generic-host
    register 0
    max_check_attempts 2
    check_interval 1
    retry_interval 0.1
    check_command check_dummy!0
    check_period 24x7
    contacts admin
    notifications_enabled 0
}
define host {
    use generic-host
    host_name localhost
    address 127.0.0.1
    hostgroups linux
}
define service {
    name generic-service
    register 0
    max_check_attempts 3
    check_interval 1
    retry_interval 0.1
    check_period 24x7
    notifications_enabled 0
}
define service {
    use generic-service
    host_name localhost
    service_description Native check
    check_command check_dummy!0
    servicegroups system
}
define service {
    use generic-service
    host_name localhost
    service_description Example alert
    check_command check_dummy!2
    servicegroups system
}
define service {
    use generic-service
    host_name localhost
    service_description Passive input
    active_checks_enabled 0
    passive_checks_enabled 1
}
define contact {
    contact_name admin
    alias Local operator
    can_submit_commands 1
}
