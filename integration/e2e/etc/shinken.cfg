# Configuration minimale de la recette e2e (integration/e2e_smoke.py).
# Les marqueurs @XXX@ sont remplacés par le script au moment du rendu.
cfg_file=satellites.cfg
cfg_file=modules.cfg
cfg_file=objects.cfg
cfg_file=resource.cfg
cfg_dir=commands

# Cadence accélérée : 1 unité d'intervalle = 1 seconde
interval_length=1
max_service_check_spread=0
max_host_check_spread=0
service_check_timeout=20
notification_timeout=30
retention_update_interval=1

log_notifications=1
log_event_handlers=1
log_passive_checks=1
log_external_commands=1
log_initial_states=1
enable_environment_macros=0

pack_distribution_file=@WORK@/var/pack_distribution.dat
workdir=@WORK@/run
lock_file=@WORK@/run/arbiterd.pid
local_log=@WORK@/log/arbiterd.log
modules_dir=@MODULES_DIR@
daemon_enabled=1
use_ssl=0
http_backend=auto
