define realm {
    realm_name  All
    default     1
}

define arbiter {
    arbiter_name    arbiter-master
    address         127.0.0.1
    port            @PORT_ARBITER@
    spare           0
    modules         named-pipe
}

define scheduler {
    scheduler_name      scheduler-master
    address             127.0.0.1
    port                @PORT_SCHEDULER@
    spare               0
    timeout             3
    data_timeout        120
    max_check_attempts  3
    check_interval      5
    modules             retention-pickle
    realm               All
}

define poller {
    poller_name         poller-master
    address             127.0.0.1
    port                @PORT_POLLER@
    spare               0
    manage_sub_realms   0
    min_workers         0
    max_workers         0
    processes_by_worker 64
    polling_interval    1
    timeout             3
    data_timeout        120
    max_check_attempts  3
    check_interval      5
    realm               All
}

define reactionner {
    reactionner_name    reactionner-master
    address             127.0.0.1
    port                @PORT_REACTIONNER@
    spare               0
    manage_sub_realms   0
    min_workers         1
    max_workers         4
    polling_interval    1
    timeout             3
    data_timeout        120
    max_check_attempts  3
    check_interval      5
    realm               All
}

define broker {
    broker_name         broker-master
    address             127.0.0.1
    port                @PORT_BROKER@
    spare               0
    manage_arbiters     1
    manage_sub_realms   1
    timeout             3
    data_timeout        120
    max_check_attempts  3
    check_interval      5
    modules             livestatus
    realm               All
}

define receiver {
    receiver_name       receiver-master
    address             127.0.0.1
    port                @PORT_RECEIVER@
    spare               0
    timeout             3
    data_timeout        120
    max_check_attempts  3
    check_interval      5
    realm               All
}
