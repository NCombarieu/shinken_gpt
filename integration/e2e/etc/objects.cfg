# Objets de la recette : un hôte, trois services, un contact notifié par
# e-mail avec les commandes livrées (etc/commands/notify-*-by-email.cfg,
# copiées par le script dans commands/).

define timeperiod {
    timeperiod_name 24x7
    alias           Always
    sunday          00:00-24:00
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
}

define command {
    command_name    e2e_state
    command_line    $LOCALPLUGINSDIR$/check_state.sh $E2E_WORK$/var/$ARG1$.state $ARG1$ $E2E_WORK$/out/checks.log
}

define contact {
    contact_name                    e2e-admin
    alias                           E2E administrator
    email                           admin@example.org
    host_notifications_enabled      1
    service_notifications_enabled   1
    host_notification_period        24x7
    service_notification_period     24x7
    host_notification_options       d,u,r
    service_notification_options    w,u,c,r
    host_notification_commands      notify-host-by-email
    service_notification_commands   notify-service-by-email
}

define host {
    host_name               e2e-host
    alias                   E2E host
    address                 127.0.0.1
    check_command           e2e_state!host
    check_interval          2
    retry_interval          1
    max_check_attempts      2
    check_period            24x7
    notification_period     24x7
    notification_interval   0
    contacts                e2e-admin
    active_checks_enabled   1
}

define service {
    name                    e2e-service
    register                0
    check_interval          2
    retry_interval          1
    max_check_attempts      2
    check_period            24x7
    notification_period     24x7
    notification_interval   0
    notification_options    w,u,c,r
    notifications_enabled   1
    contacts                e2e-admin
    active_checks_enabled   1
    passive_checks_enabled  1
}

define service {
    use                     e2e-service
    host_name               e2e-host
    service_description     Flip
    check_command           e2e_state!flip
}

define service {
    use                     e2e-service
    host_name               e2e-host
    service_description     Static
    check_command           e2e_state!static
}

define service {
    use                     e2e-service
    host_name               e2e-host
    service_description     Passive
    check_command           e2e_state!passive
    active_checks_enabled   0
    max_check_attempts      1
    check_freshness         0
}
