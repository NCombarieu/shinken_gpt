# Modules selon les interfaces figées du contrat d'équipe
# (retention-pickle, logstore-sqlite, named-pipe).

define module {
    module_name     livestatus
    module_type     livestatus
    host            127.0.0.1
    port            @PORT_LIVESTATUS@
    modules         logstore-sqlite
}

define module {
    module_name     logstore-sqlite
    module_type     logstore_sqlite
    database_file   @WORK@/var/livestatus.db
    max_logs_age    3m
    archive_path    @WORK@/var/archives/
}

define module {
    module_name     retention-pickle
    module_type     pickle_retention_file
    path            @WORK@/var/retention.dat
}

define module {
    module_name     named-pipe
    module_type     named_pipe
    command_file    @WORK@/var/nagios.cmd
}
