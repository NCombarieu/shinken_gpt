# Escalades de notification : exemples désactivés.
# Voir doc/admin/13-dependances-escalades.md.
#
# Forme « Nagios » : escalade d'un service précis. À partir de la 3e
# notification du service « HTTPS » de www.example.com et jusqu'à la 5e,
# le groupe « astreinte » est aussi prévenu, toutes les 30 minutes.
#define serviceescalation {
#    host_name               www.example.com
#    service_description     HTTPS
#    contact_groups          astreinte
#    first_notification      3
#    last_notification       5
#    notification_interval   30
#    escalation_period       24x7
#    escalation_options      w,u,c,r
#}
#
# Forme propre à Shinken : une escalade nommée, réutilisable, que l'on
# rattache aux hôtes ou services par la directive « escalations ».
# first_notification_time est exprimé en minutes depuis le début du problème.
#define escalation {
#    escalation_name             vers-astreinte-1h
#    first_notification_time     60
#    last_notification_time      240
#    notification_interval       30
#    contact_groups              astreinte
#}
#
# Puis, dans la définition du service : « escalations  vers-astreinte-1h ».
