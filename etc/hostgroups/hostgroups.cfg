# Groupes d'hôtes d'exemple. Un hôte rejoint un groupe avec la directive
# « hostgroups » ; un service peut ensuite être appliqué à tout un groupe avec
# « hostgroup_name » (voir doc/admin/12-groupes.md).

define hostgroup {
    hostgroup_name  shinken
    alias           Serveurs de supervision
}

define hostgroup {
    hostgroup_name  linux
    alias           Serveurs Linux
}

define hostgroup {
    hostgroup_name  windows
    alias           Serveurs Windows
}

define hostgroup {
    hostgroup_name  reseau
    alias           Équipements réseau
}

define hostgroup {
    hostgroup_name  web
    alias           Sites web
}
