# Notification par e-mail « détaillée » (HTML enrichi des macros
# personnalisées _DETAILLEDDESC, _IMPACT, _FIXACTIONS des hôtes et services).
#
# min_business_impact 1 : seuls les éléments dont business_impact est >= 1
# déclenchent ce mode de notification (voir doc/admin/17-notifications.md).
define notificationway {
    notificationway_name            detailled-email
    host_notification_period        24x7
    service_notification_period     24x7
    host_notification_options       d,u,r,f,s
    service_notification_options    w,u,c,r
    host_notification_commands      detailled-host-by-email
    service_notification_commands   detailled-service-by-email
    min_business_impact             1
}
