# Notification par e-mail, à toute heure. Utilisée par le modèle
# generic-contact. Les commandes notify-*-by-email envoient le message via le
# relais SMTP défini dans resource.d/notifications.cfg
# (voir doc/admin/17-notifications.md).
#
# Options hôte    : d = DOWN, u = UNREACHABLE, r = rétablissement,
#                   f = début/fin de flapping, s = début/fin de downtime.
# Options service : w = WARNING, u = UNKNOWN, c = CRITICAL, r = rétablissement,
#                   f = flapping, s = downtime.
define notificationway {
    notificationway_name            email
    host_notification_period        24x7
    service_notification_period     24x7
    host_notification_options       d,u,r,f,s
    service_notification_options    w,u,c,r,f,s
    host_notification_commands      notify-host-by-email
    service_notification_commands   notify-service-by-email
}
