## NRPE agent: Linux nagios-nrpe-server or Windows NSClient++
## (doc/checks/nrpe.md).
##
## Prefer commands/aliases defined ON THE AGENT (no arguments sent): the
## thresholds stay on the agent and "allow arguments" can stay off.

# check_nrpe!<command or alias defined on the agent>   e.g. check_nrpe!check_load
# Encrypted (TLS), no certificate check. -u: connection problems -> UNKNOWN.
define command {
    command_name    check_nrpe
    command_line    $NAGIOSPLUGINSDIR$/check_nrpe -H $HOSTADDRESS$ -t 30 -u -c $ARG1$
}

# Same, with mutual TLS: Shinken checks the agent certificate against ca.crt
# and presents its own client certificate (agent side: ssl_client_certs=2 /
# NSClient++ "verify mode = peer-cert"). Files in etc/certs/, see
# etc/certs/README.md. The key must be readable by the poller (uid 10001).
define command {
    command_name    check_nrpe_ssl
    command_line    $NAGIOSPLUGINSDIR$/check_nrpe -H $HOSTADDRESS$ -t 30 -u -c $ARG1$ \
                     --ssl-version=TLSv1.2+ \
                     -A /etc/shinken/certs/ca.crt \
                     -C /etc/shinken/certs/shinken-server.crt \
                     -K /etc/shinken/certs/shinken-server.key
}

# Host check: the agent answers (returns its version).
define command {
    command_name    check_nrpe_alive
    command_line    $NAGIOSPLUGINSDIR$/check_nrpe -H $HOSTADDRESS$ -t 15
}
