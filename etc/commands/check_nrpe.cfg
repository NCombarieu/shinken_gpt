# Interrogation d'un agent NRPE (Linux) ou NSClient++ (Windows).
# Recettes : doc/admin/recettes/linux-nrpe.md et doc/admin/recettes/windows.md
#
# Usage : check_nrpe!<nom de commande déclaré dans l'agent>
# -u : un délai dépassé donne UNKNOWN au lieu de CRITICAL.
# Le timeout (9 s) doit rester inférieur à service_check_timeout (shinken.cfg).
define command {
    command_name    check_nrpe
    command_line    $NAGIOSPLUGINSDIR$/check_nrpe -H $HOSTADDRESS$ -t 9 -u -c $ARG1$
}
