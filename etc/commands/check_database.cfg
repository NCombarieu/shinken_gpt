# Checks de bases de données. Recette : doc/admin/recettes/bases-de-donnees.md
#
# Les identifiants sont des macros de ressource (resource.d/databases.cfg) :
# ils n'apparaissent ni dans les définitions d'hôtes ni dans l'interface web.
# Utiliser un compte dédié, en lecture seule.

# check_mysql   Connexion et état du serveur MySQL/MariaDB.
define command {
    command_name    check_mysql
    command_line    $NAGIOSPLUGINSDIR$/check_mysql -H $HOSTADDRESS$ -u $MYSQLUSER$ -p $MYSQLPASSWORD$
}

# check_mysql_replication!<retard WARNING en s>!<retard CRITICAL en s>
define command {
    command_name    check_mysql_replication
    command_line    $NAGIOSPLUGINSDIR$/check_mysql -H $HOSTADDRESS$ -u $MYSQLUSER$ -p $MYSQLPASSWORD$ -S -w $ARG1$ -c $ARG2$
}

# check_pgsql!<base>   Connexion à une base PostgreSQL.
define command {
    command_name    check_pgsql
    command_line    $NAGIOSPLUGINSDIR$/check_pgsql -H $HOSTADDRESS$ -l $PGUSER$ -p $PGPASSWORD$ -d $ARG1$
}
