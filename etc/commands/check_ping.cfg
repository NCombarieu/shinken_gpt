# Qualité de la liaison réseau (temps de réponse et pertes) par ICMP.
#
# Usage : check_ping   (seuils fixes ci-dessous)
# WARNING si temps aller-retour > 3000 ms ou 100 % de pertes,
# CRITICAL si > 5000 ms ou 100 % de pertes ; 10 paquets envoyés.
# Adapter les seuils (-w <ms>,<pertes>% -c <ms>,<pertes>%) selon le réseau.
define command {
    command_name    check_ping
    command_line    $NAGIOSPLUGINSDIR$/check_icmp -H $HOSTADDRESS$ -w 3000,100% -c 5000,100% -n 10
}
