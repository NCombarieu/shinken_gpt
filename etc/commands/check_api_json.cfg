# Checks d'API HTTP(S) JSON (script libexec/check_api_json.py, bibliothèque
# standard Python uniquement).
# Recette : doc/admin/recettes/api-rest.md
#
# L'URL complète est passée en argument : une API n'est pas toujours servie
# à l'adresse de l'hôte (passerelle, sous-chemin, port dédié).

# check_api_json_value!<URL>!<champ>!<valeur attendue>
# CRITICAL si le champ (chemin à points : data.status, nodes.0.state) ne vaut
# pas exactement la valeur attendue.
define command {
    command_name    check_api_json_value
    command_line    $PLUGINSDIR$/check_api_json.py -u '$ARG1$' -k '$ARG2$' -e '$ARG3$' -t 10
}

# check_api_json_threshold!<URL>!<champ>!<warning>!<critical>
# Seuils maximums : alerte quand la valeur atteint le seuil (file d'attente,
# latence, nombre d'erreurs).
define command {
    command_name    check_api_json_threshold
    command_line    $PLUGINSDIR$/check_api_json.py -u '$ARG1$' -k '$ARG2$' -w $ARG3$ -c $ARG4$ -t 10
}

# check_api_json_minimum!<URL>!<champ>!<warning>!<critical>
# Seuils minimums : alerte quand la valeur descend au seuil (quota restant,
# nombre de nœuds actifs).
define command {
    command_name    check_api_json_minimum
    command_line    $PLUGINSDIR$/check_api_json.py -u '$ARG1$' -k '$ARG2$' --min -w $ARG3$ -c $ARG4$ -t 10
}

# check_api_json_token!<URL>!<champ>!<valeur attendue>!<fichier du jeton>
# Comme check_api_json_value, avec un jeton « Authorization: Bearer »
# lu dans un fichier (jamais le jeton en clair dans la configuration : il
# serait visible dans Thruk et dans la liste des processus). Le fichier se
# place dans etc/certs/ (non versionné), lisible par l'UID 10001.
define command {
    command_name    check_api_json_token
    command_line    $PLUGINSDIR$/check_api_json.py -u '$ARG1$' -k '$ARG2$' -e '$ARG3$' --token-file '$ARG4$' -t 10
}
