# Check « factice » : renvoie le code et le texte demandés.
#
# Usage : check_dummy!<code 0-3>!<texte>
# Sert surtout de check_command aux services passifs : quand plus aucun
# résultat n'arrive (check_freshness), Shinken exécute cette commande, ce qui
# fait passer le service dans l'état choisi. Voir
# doc/admin/15-checks-passifs-commandes-externes.md.
define command {
    command_name    check_dummy
    command_line    $NAGIOSPLUGINSDIR$/check_dummy $ARG1$ "$ARG2$"
}
