# Checks HTTP et HTTPS (plugin check_http des monitoring-plugins).
# Recette : doc/admin/recettes/http-tls.md
#
# $HOSTADDRESS$ est utilisé comme adresse ET comme nom virtuel (en-tête Host
# et SNI) : déclarer l'hôte avec son nom DNS comme adresse.

# check_http!<URL>   (ex. check_http!/)
define command {
    command_name    check_http
    command_line    $NAGIOSPLUGINSDIR$/check_http -H $HOSTADDRESS$ -u $ARG1$ -t 10
}

# check_https!<URL>   (ex. check_https!/)
define command {
    command_name    check_https
    command_line    $NAGIOSPLUGINSDIR$/check_http -H $HOSTADDRESS$ -u $ARG1$ -S --sni -t 10
}

# check_https_certificate!<jours WARNING>,<jours CRITICAL>
# Vérifie uniquement la date d'expiration du certificat (ex. 30,14).
define command {
    command_name    check_https_certificate
    command_line    $NAGIOSPLUGINSDIR$/check_http -H $HOSTADDRESS$ -S --sni -C $ARG1$ -t 10
}

# check_ssh   Vérifie que le serveur SSH répond (bannière).
define command {
    command_name    check_ssh
    command_line    $NAGIOSPLUGINSDIR$/check_ssh -t 10 $HOSTADDRESS$
}
