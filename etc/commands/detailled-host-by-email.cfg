## Notification détaillée d'un hôte par e-mail
# Utilise les macros personnalisées _DETAILLEDDESC et _IMPACT de l'hôte
# (voir le pack unix-fs pour un exemple). Relais SMTP : etc/resource.d/notifications.cfg
define command {
    command_name    detailled-host-by-email
    command_line    $PLUGINSDIR$/notify_by_email.py -n host -S $SMTP_HOST$ --smtp-port $SMTP_PORT$ -s $MAIL_FROM$ -r $CONTACTEMAIL$ -f html -c "$NOTIFICATIONTYPE$,,$HOSTNAME$,,$HOSTADDRESS$,,$LONGDATETIME$" -o "$HOSTSTATE$,,$HOSTDURATION$" -d "$_HOSTDETAILLEDDESC$" -i "$_HOSTIMPACT$"
}
