# Check de disponibilité d'hôte par défaut (utilisé par le modèle generic-host).
#
# Envoie 2 paquets ICMP : l'hôte est DOWN seulement si tous sont perdus.
# check_icmp a besoin de la capacité NET_RAW, accordée au seul conteneur
# poller (voir compose.yaml). Pour un hôte qui ne répond pas au ping, définir
# un autre check_command dans l'hôte, par exemple check_tcp!22.
define command {
    command_name    check_host_alive
    command_line    $NAGIOSPLUGINSDIR$/check_icmp -H $HOSTADDRESS$ -w 1000,100% -c 3000,100% -n 2
}
