## SNMP checks (doc/checks/snmp.md).
##
## Community, port and SNMPv3 user come from the host (template snmp-host:
## _SNMP_COMMUNITY, _SNMP_PORT, _SNMP_V3_USER). SNMPv3 passwords come from
## the resource macros $SNMPV3AUTHPASS$ / $SNMPV3PRIVPASS$ (etc/resource.d,
## keep the real values in a git-ignored *.local.cfg file).
##
## Plugins: check_snmp (monitoring-plugins-standard) and the Manubulon
## *.pl plugins (nagios-snmp-plugins). Use numeric OIDs: the image ships no
## non-free MIBs.

# check_snmp_storage!<regex on storage name>!<warn %>!<crit %>
#   e.g. check_snmp_storage!^/$!85!95   (Linux net-snmp)
#        check_snmp_storage!^C:!85!95    (Windows)
define command {
    command_name    check_snmp_storage
    command_line    $NAGIOSPLUGINSDIR$/check_snmp_storage.pl -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -C $_HOSTSNMP_COMMUNITY$ -2 -m "$ARG1$" -w $ARG2$ -c $ARG3$ -f -t 15
}

define command {
    command_name    check_snmp_storage_v3
    command_line    $NAGIOSPLUGINSDIR$/check_snmp_storage.pl -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -l $_HOSTSNMP_V3_USER$ -x '$SNMPV3AUTHPASS$' -X '$SNMPV3PRIVPASS$' -L sha,aes -m "$ARG1$" -w $ARG2$ -c $ARG3$ -f -t 15
}
