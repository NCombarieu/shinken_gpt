# Occupation des volumes par SNMP (script check_snmp_storage.pl).
#
# Ce script n'appartient pas aux monitoring-plugins : il vient du paquet
# Debian « nagios-snmp-plugins » (scripts « Manubulon », Perl + Net::SNMP),
# qui fournit aussi check_snmp_load.pl, check_snmp_mem.pl, check_snmp_int.pl…
# Vérifier sa présence dans l'image du poller :
#   podman exec <conteneur poller> ls /usr/lib/nagios/plugins/check_snmp_storage.pl
#
# Usage : check_snmp_storage!<regex du volume>!<% WARNING>!<% CRITICAL>
define command {
    command_name    check_snmp_storage
    command_line    $NAGIOSPLUGINSDIR$/check_snmp_storage.pl -H $HOSTADDRESS$ -C $_HOSTSNMPCOMMUNITY$ -2 -m $ARG1$ -f -w $ARG2$ -c $ARG3$ -S0,1 -o 65535
}
