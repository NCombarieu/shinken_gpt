# Occupation des volumes par SNMP (script check_snmp_storage.pl).
#
# Prérequis : ce script n'est PAS fourni par les monitoring-plugins. Il fait
# partie du paquet Debian « nagios-snmp-plugins » (scripts « Manubulon »,
# Perl + Net::SNMP) qu'il faut ajouter à l'image du poller, ou déposer dans
# plugins-local/ (voir doc/admin/16-ecrire-un-plugin.md).
#
# Usage : check_snmp_storage!<regex du volume>!<% WARNING>!<% CRITICAL>
define command {
    command_name    check_snmp_storage
    command_line    $NAGIOSPLUGINSDIR$/check_snmp_storage.pl -H $HOSTADDRESS$ -C $_HOSTSNMPCOMMUNITY$ -2 -m $ARG1$ -f -w $ARG2$ -c $ARG3$ -S0,1 -o 65535
}
