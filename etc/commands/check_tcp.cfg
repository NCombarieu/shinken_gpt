# Ouverture d'un port TCP sur l'hôte.
#
# Usage : check_tcp!<port>   (ex. check_tcp!443)
# Options utiles du plugin : -w/-c (temps de réponse en secondes),
# -s/-e (chaîne envoyée / attendue), -t (timeout).
define command {
    command_name    check_tcp
    command_line    $NAGIOSPLUGINSDIR$/check_tcp -H $HOSTADDRESS$ -p $ARG1$
}
