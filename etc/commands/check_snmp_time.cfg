# Écart d'horloge entre l'équipement et le poller, par SNMP
# (script check_snmp_time.pl).
#
# Prérequis : script tiers, non fourni par les monitoring-plugins ni par
# l'image. Le déposer dans plugins-local/ avec ses dépendances Perl
# (Net::SNMP), puis remplacer $NAGIOSPLUGINSDIR$ par $LOCALPLUGINSDIR$.
#
# Usage : check_snmp_time!<écart WARNING en s>!<écart CRITICAL en s>
define command {
    command_name    check_snmp_time
    command_line    $NAGIOSPLUGINSDIR$/check_snmp_time.pl -H $HOSTADDRESS$ -C $_HOSTSNMPCOMMUNITY$ -f -w $ARG1$ -c $ARG2$
}
