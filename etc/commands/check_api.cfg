## HTTP / REST API checks (doc/checks/api.md).

# check_https_status!<url path>!<expected regex in body>
#   e.g. check_https_status!/health!status.{1,3}UP
# The regex is put between double quotes: do not use " in it (use . instead),
# or prefer check_json_api_expect for JSON. HTTPS with SNI, certificate
# chain and name verified (-D); follows redirects.
# The host "address" is used as virtual host and SNI name: give the FQDN
# of the site (portail.example.org), not an IP address.
define command {
    command_name    check_https_status
    command_line    $NAGIOSPLUGINSDIR$/check_curl -H $HOSTADDRESS$ -S --sni -D -u "$ARG1$" -r "$ARG2$" -f curl -t 15
}

# Plain HTTP variant (internal services).
define command {
    command_name    check_http_status
    command_line    $NAGIOSPLUGINSDIR$/check_curl -H $HOSTADDRESS$ -u "$ARG1$" -r "$ARG2$" -f curl -t 15
}

# check_https_cert!<warn days>!<crit days>     e.g. check_https_cert!30!14
define command {
    command_name    check_https_cert
    command_line    $NAGIOSPLUGINSDIR$/check_curl -H $HOSTADDRESS$ -S --sni -D -C $ARG1$,$ARG2$ -t 15
}

# check_json_api!<url>!<json path>!<warn>!<crit>
#   e.g. check_json_api!https://api.example.org/metrics!queue.pending!100!500
define command {
    command_name    check_json_api
    command_line    $SHINKENPLUGINSDIR$/check_json_api -u "$ARG1$" -p "$ARG2$" -w "$ARG3$" -c "$ARG4$" -t 15
}

# check_json_api_expect!<url>!<json path>!<expected value>
#   e.g. check_json_api_expect!https://app.example.org/actuator/health!status!UP
define command {
    command_name    check_json_api_expect
    command_line    $SHINKENPLUGINSDIR$/check_json_api -u "$ARG1$" -p "$ARG2$" -e "$ARG3$" -t 15
}

# Same with a bearer token read from a file (not visible in "ps" nor in
# the configuration): check_json_api_token!<url>!<path>!<expected>!<token file name>
# Token files go in etc/secrets/ (ignored by git), readable by uid 10001.
define command {
    command_name    check_json_api_token
    command_line    $SHINKENPLUGINSDIR$/check_json_api -u "$ARG1$" -p "$ARG2$" -e "$ARG3$" --token-file /etc/shinken/secrets/$ARG4$ -t 15
}
