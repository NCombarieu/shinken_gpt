## Notification détaillée d'un service par e-mail
# Utilise les macros personnalisées _DETAILLEDESC, _IMPACT et _FIXACTIONS du
# service (voir le pack unix-fs pour un exemple). Relais SMTP : etc/resource.d/notifications.cfg
define command {
    command_name    detailled-service-by-email
    command_line    $PLUGINSDIR$/notify_by_email.py -n service -S $SMTP_HOST$ --smtp-port $SMTP_PORT$ -s $MAIL_FROM$ -r $CONTACTEMAIL$ -f html -c "$NOTIFICATIONTYPE$,,$HOSTNAME$,,$HOSTADDRESS$,,$LONGDATETIME$" -o "$SERVICEDESC$,,$SERVICESTATE$,,$SERVICEOUTPUT$,,$SERVICEDURATION$" -d "$_SERVICEDETAILLEDESC$" -i "$_SERVICEIMPACT$" -a "$_SERVICEFIXACTIONS$"
}
