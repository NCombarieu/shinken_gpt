# Checks exécutés localement par le poller.
#
# Ils mesurent la machine qui exécute le plugin (le conteneur poller en
# déploiement Podman), pas un hôte distant.

# check_local_load!<seuils WARNING 1,5,15 min>!<seuils CRITICAL 1,5,15 min>
define command {
    command_name    check_local_load
    command_line    $NAGIOSPLUGINSDIR$/check_load -w $ARG1$ -c $ARG2$
}

# check_local_disk!<seuil WARNING>!<seuil CRITICAL>!<point de montage>
# Les seuils en % désignent l'espace LIBRE restant.
define command {
    command_name    check_local_disk
    command_line    $NAGIOSPLUGINSDIR$/check_disk -w $ARG1$ -c $ARG2$ -p $ARG3$
}

# check_local_users!<seuil WARNING>!<seuil CRITICAL>
define command {
    command_name    check_local_users
    command_line    $NAGIOSPLUGINSDIR$/check_users -w $ARG1$ -c $ARG2$
}

# check_local_http!<nom ou IP>!<port>!<URL>
# Utile pour joindre un autre conteneur par son nom (ex. « broker »).
define command {
    command_name    check_local_http
    command_line    $NAGIOSPLUGINSDIR$/check_http -H $ARG1$ -p $ARG2$ -u $ARG3$
}

# check_local_tcp!<nom ou IP>!<port>
define command {
    command_name    check_local_tcp
    command_line    $NAGIOSPLUGINSDIR$/check_tcp -H $ARG1$ -p $ARG2$
}
