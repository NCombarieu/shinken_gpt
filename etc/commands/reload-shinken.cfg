define command {
    command_name        reload-shinken
    # No init.d script exists in this containerized deployment (each
    # daemon is its own container), and Shinken has no live SIGHUP-style
    # config reload -- so "reload" here means the same thing as
    # "restart": kill the arbiter's own process. tini (PID 1) then exits
    # the container, and "restart: unless-stopped" in compose.yaml
    # respawns it, which re-reads etc/ and re-dispatches config to every
    # other daemon.
    command_line        /usr/bin/pkill -TERM -f shinken-arbiter
}
