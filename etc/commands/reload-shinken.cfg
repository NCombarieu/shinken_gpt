# Commande appelée par la commande externe RELOAD_CONFIG (bouton « Reload »
# de Thruk). Elle est exécutée par l'arbiter, dans son conteneur.
#
# Shinken n'a pas de rechargement à chaud : recharger = redémarrer l'arbiter,
# qui relit etc/ puis renvoie la configuration à tous les autres daemons.
# « kill -TERM 1 » arrête proprement le processus principal du conteneur
# arbiter (tini), puis la politique de redémarrage du conteneur (compose ou
# quadlet) le relance.
#
# Installation hors conteneur : remplacer par la commande de votre gestionnaire
# de services, par exemple « sudo systemctl restart shinken-arbiter » (droit
# sudo à accorder explicitement au compte shinken).
define command {
    command_name    reload-shinken
    command_line    /bin/sh -c "kill -TERM 1"
}
