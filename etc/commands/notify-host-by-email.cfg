## Notification d'un hôte par e-mail (relais SMTP : etc/resource.d/notifications.cfg)
define command {
    command_name    notify-host-by-email
    command_line    $PLUGINSDIR$/notify_by_email.py -n host -S $SMTP_HOST$ --smtp-port $SMTP_PORT$ -s $MAIL_FROM$ -r $CONTACTEMAIL$ -f html -c "$NOTIFICATIONTYPE$,,$HOSTNAME$,,$HOSTADDRESS$,,$LONGDATETIME$" -o "$HOSTSTATE$,,$HOSTDURATION$"
}
