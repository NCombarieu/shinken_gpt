## Notification d'un hôte par XMPP
# Nécessite le paquet Python xmpppy et un compte XMPP : renseignez username et
# password dans notify_by_xmpp.ini (en conteneur, montez votre propre fichier en
# lecture seule sur $PLUGINSDIR$/notify_by_xmpp.ini dans le reactionner).
define command {
    command_name    notify-host-by-xmpp
    command_line    $PLUGINSDIR$/notify_by_xmpp.py -a $PLUGINSDIR$/notify_by_xmpp.ini "Host '$HOSTNAME$' is $HOSTSTATE$ - Info : $HOSTOUTPUT$" $CONTACTEMAIL$
}
