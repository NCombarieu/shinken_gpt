## Clock offset of a host, asked to its own NTP service (UDP 123): the target
## must serve NTP (chrony does not by default). -q: UNKNOWN, not CRITICAL,
## when no offset can be obtained.
## Clock offset of a host against its NTP service (replaces the former
## check_snmp_time, whose plugin is not packaged anywhere).
# check_ntp_time!<warn s>!<crit s>     e.g. check_ntp_time!0.5!1
define command {
    command_name    check_ntp_time
    command_line    $NAGIOSPLUGINSDIR$/check_ntp_time -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$ -q -t 10
}
