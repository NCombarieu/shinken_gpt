# Check exécuté sur un serveur distant via SSH.
#
# Usage : check_by_ssh!<commande distante>
#
# - La clé privée ($SSHKEY$) et le compte distant ($SSHUSER$) sont définis
#   dans resource.d/ssh.cfg.
# - Bonne pratique : côté serveur supervisé, restreindre la clé publique avec
#   command="..." dans authorized_keys. La commande envoyée par -C est alors
#   ignorée et seule la commande imposée s'exécute. C'est cette restriction,
#   pas les options ci-dessous, qui protège le serveur supervisé.
#   Voir doc/admin/recettes/linux-ssh.md.
# - StrictHostKeyChecking=accept-new enregistre la clé d'hôte au premier
#   contact (dans ~/.ssh/known_hosts du compte shinken) puis refuse tout
#   changement ultérieur.
define command {
    command_name    check_by_ssh
    command_line    $NAGIOSPLUGINSDIR$/check_by_ssh -H $HOSTADDRESS$ -l $SSHUSER$ -i $SSHKEY$ -o StrictHostKeyChecking=accept-new -t 15 -C "$ARG1$"
}
