## Active checks over SSH (doc/checks/ssh-actif.md).
##
## The poller's entrypoint copies every private key found in
## /etc/shinken/ssh_keys to a private runtime directory and writes the ssh
## client config (identities, known_hosts, BatchMode): no -i/-o here.
##
## The real security boundary is on the target: the key is restricted in
## authorized_keys with command="/usr/local/bin/shinken-checks" (see
## contrib/checks/ssh/shinken-checks). -C only sends a check *name* that the
## target compares against its fixed list.

# check_by_ssh!<check name>   e.g. check_by_ssh!disk
# User and port come from the host (template linux-ssh: _SSH_USER, _SSH_PORT).
define command{
    command_name    check_by_ssh
    command_line    $NAGIOSPLUGINSDIR$/check_by_ssh -H $HOSTADDRESS$ -p $_HOSTSSH_PORT$ \
                     -l $_HOSTSSH_USER$ -C "$ARG1$" -t 30 -E
}

# Kept for existing services: check_by_ssh_cpu!<user>. The target's forced
# command decides what runs (see etc/services/this-vps.cfg).
define command{
    command_name    check_by_ssh_cpu
    command_line    $NAGIOSPLUGINSDIR$/check_by_ssh -H $HOSTADDRESS$ \
                     -l $ARG1$ -C "check_cpu" -t 15
}

# Host check: is sshd answering at all? (no key needed)
define command{
    command_name    check_ssh_port
    command_line    $NAGIOSPLUGINSDIR$/check_ssh -p $_HOSTSSH_PORT$ -t 10 $HOSTADDRESS$
}
