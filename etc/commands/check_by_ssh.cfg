## Check via SSH avec une clef dediee, restreinte cote serveur cible a
## une seule commande forcee (voir ~/.ssh/authorized_keys du compte
## cible : "command=... no-pty ..."). check_by_ssh transmet -C "..." mais
## la cible l'ignore totalement grace a la restriction command= -- c'est
## la ligne de defense reelle, pas les options ci-dessous.
define command{
    command_name    check_by_ssh_cpu
    command_line    $NAGIOSPLUGINSDIR$/check_by_ssh -H $HOSTADDRESS$ \
                     -i /etc/shinken/ssh_keys/shinken_monitoring \
                     -l $ARG1$ -C "check_cpu" -t 15
}
