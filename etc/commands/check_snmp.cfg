# Checks SNMP (v2c). Recette : doc/admin/recettes/snmp.md
#
# La communauté utilisée est la macro personnalisée de l'hôte
# $_HOSTSNMPCOMMUNITY$. Le modèle generic-host lui donne la valeur par défaut
# $SNMPCOMMUNITYREAD$ (resource.d/snmp.cfg) ; un hôte peut la redéfinir avec
# la directive « _SNMPCOMMUNITY ».

# check_snmp_uptime   Temps depuis le dernier redémarrage de l'agent SNMP.
define command {
    command_name    check_snmp_uptime
    command_line    $NAGIOSPLUGINSDIR$/check_snmp -H $HOSTADDRESS$ -P 2c -C $_HOSTSNMPCOMMUNITY$ -o 1.3.6.1.2.1.1.3.0 -l Uptime
}

# check_snmp_oid!<OID>!<seuil WARNING>!<seuil CRITICAL>
# Valeur numérique quelconque, ex. check_snmp_oid!1.3.6.1.4.1.2021.10.1.5.1!80!90
define command {
    command_name    check_snmp_oid
    command_line    $NAGIOSPLUGINSDIR$/check_snmp -H $HOSTADDRESS$ -P 2c -C $_HOSTSNMPCOMMUNITY$ -o $ARG1$ -w $ARG2$ -c $ARG3$
}

# check_snmp_interface!<index ifOperStatus>
# État opérationnel d'une interface : 1 = up (OK), toute autre valeur = CRITICAL.
define command {
    command_name    check_snmp_interface
    command_line    $NAGIOSPLUGINSDIR$/check_snmp -H $HOSTADDRESS$ -P 2c -C $_HOSTSNMPCOMMUNITY$ -o 1.3.6.1.2.1.2.2.1.8.$ARG1$ -c 1:1 -l "Interface $ARG1$"
}
