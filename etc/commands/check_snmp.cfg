## Generic SNMP and system checks (doc/checks/snmp.md). See the header of
## check_snmp_storage.cfg for where community/v3 credentials come from.

# check_snmp_get!<numeric OID>     read a value, no threshold (always OK if it answers)
define command {
    command_name    check_snmp_get
    command_line    $NAGIOSPLUGINSDIR$/check_snmp -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -P 2c -C $_HOSTSNMP_COMMUNITY$ -o $ARG1$ -t 15
}

# check_snmp_oid!<numeric OID>!<warn>!<crit>   (both thresholds required, Nagios ranges)     e.g. check_snmp_oid!.1.3.6.1.4.1.2021.10.1.5.1!300!500
define command {
    command_name    check_snmp_oid
    command_line    $NAGIOSPLUGINSDIR$/check_snmp -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -P 2c -C $_HOSTSNMP_COMMUNITY$ -o $ARG1$ -w $ARG2$ -c $ARG3$ -t 15
}

define command {
    command_name    check_snmp_oid_v3
    command_line    $NAGIOSPLUGINSDIR$/check_snmp -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -P 3 -L authPriv -U $_HOSTSNMP_V3_USER$ -a SHA -A '$SNMPV3AUTHPASS$' -x AES -X '$SNMPV3PRIVPASS$' -o $ARG1$ -w $ARG2$ -c $ARG3$ -t 15
}

# Host check for SNMP-only devices (switches, printers, UPS): sysUpTime answers.
define command {
    command_name    check_snmp_alive
    command_line    $NAGIOSPLUGINSDIR$/check_snmp -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -P 2c -C $_HOSTSNMP_COMMUNITY$ -o .1.3.6.1.2.1.1.3.0 -t 10
}

define command {
    command_name    check_snmp_alive_v3
    command_line    $NAGIOSPLUGINSDIR$/check_snmp -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -P 3 -L authPriv -U $_HOSTSNMP_V3_USER$ -a SHA -A '$SNMPV3AUTHPASS$' -x AES -X '$SNMPV3PRIVPASS$' -o .1.3.6.1.2.1.1.3.0 -t 10
}

# check_snmp_load!<warn 1,5,15>!<crit 1,5,15>    e.g. check_snmp_load!3,3,2!5,5,4
# -T netsl: net-snmp (Linux) load averages; use -T stand for CPU % (Windows, switches).
define command {
    command_name    check_snmp_load
    command_line    $NAGIOSPLUGINSDIR$/check_snmp_load.pl -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -C $_HOSTSNMP_COMMUNITY$ -2 -T netsl -w $ARG1$ -c $ARG2$ -f -t 15
}

# check_snmp_cpu!<warn %>!<crit %>    CPU usage (hrProcessorLoad: Windows, Linux, most devices)
# With -T stand the thresholds are single values (80), not 1,5,15 triplets.
define command {
    command_name    check_snmp_cpu
    command_line    $NAGIOSPLUGINSDIR$/check_snmp_load.pl -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -C $_HOSTSNMP_COMMUNITY$ -2 -T stand -w $ARG1$ -c $ARG2$ -f -t 15
}

# check_snmp_mem!<warn ram%,swap%>!<crit ram%,swap%>    e.g. check_snmp_mem!90,30!95,50  (net-snmp)
define command {
    command_name    check_snmp_mem
    command_line    $NAGIOSPLUGINSDIR$/check_snmp_mem.pl -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -C $_HOSTSNMP_COMMUNITY$ -2 -N -w $ARG1$ -c $ARG2$ -f -t 15
}

# check_snmp_int!<regex on interface name>     e.g. check_snmp_int!^eth0$
# Status only (UP/DOWN); see doc/checks/snmp.md for bandwidth thresholds (-k).
define command {
    command_name    check_snmp_int
    command_line    $NAGIOSPLUGINSDIR$/check_snmp_int.pl -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -C $_HOSTSNMP_COMMUNITY$ -2 -n "$ARG1$" -f -t 15
}

define command {
    command_name    check_snmp_load_v3
    command_line    $NAGIOSPLUGINSDIR$/check_snmp_load.pl -H $HOSTADDRESS$ -p $_HOSTSNMP_PORT$ -l $_HOSTSNMP_V3_USER$ -x '$SNMPV3AUTHPASS$' -X '$SNMPV3PRIVPASS$' -L sha,aes -T netsl -w $ARG1$ -c $ARG2$ -f -t 15
}
