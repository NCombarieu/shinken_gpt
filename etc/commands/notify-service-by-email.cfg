## Notification d'un service par e-mail (relais SMTP : etc/resource.d/notifications.cfg)
define command {
    command_name    notify-service-by-email
    command_line    $PLUGINSDIR$/notify_by_email.py -n service -S $SMTP_HOST$ --smtp-port $SMTP_PORT$ -s $MAIL_FROM$ -r $CONTACTEMAIL$ -f html -c "$NOTIFICATIONTYPE$,,$HOSTNAME$,,$HOSTADDRESS$,,$LONGDATETIME$" -o "$SERVICEDESC$,,$SERVICESTATE$,,$SERVICEOUTPUT$,,$SERVICEDURATION$"
}
