# Checks DNS. Recette : doc/admin/recettes/dns.md
#
# check_dig!<nom à résoudre>
# Interroge le serveur DNS $HOSTADDRESS$ (l'hôte supervisé est le serveur DNS).
define command {
    command_name    check_dig
    command_line    $NAGIOSPLUGINSDIR$/check_dig -H $HOSTADDRESS$ -l $ARG1$
}

# check_dns!<nom à résoudre>!<adresse attendue>
# Vérifie que $HOSTADDRESS$ (serveur DNS) résout le nom vers l'adresse attendue.
define command {
    command_name    check_dns
    command_line    $NAGIOSPLUGINSDIR$/check_dns -H $ARG1$ -s $HOSTADDRESS$ -a $ARG2$
}
