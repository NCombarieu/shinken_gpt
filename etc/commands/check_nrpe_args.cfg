# Interrogation d'un agent NRPE en lui passant des arguments.
#
# Usage : check_nrpe_args!<commande>!<arg1>!<arg2>!<arg3>!<arg4>
# L'agent doit autoriser les arguments (dont_blame_nrpe=1 côté NRPE,
# allow arguments côté NSClient++), ce qui élargit la surface d'attaque :
# préférer check_nrpe avec des commandes figées dans l'agent.
define command {
    command_name    check_nrpe_args
    command_line    $NAGIOSPLUGINSDIR$/check_nrpe -H $HOSTADDRESS$ -t 9 -u -c $ARG1$ -a $ARG2$ $ARG3$ $ARG4$ $ARG5$
}
