## NRPE with arguments (doc/checks/nrpe.md). Needs "allow arguments" on the
## agent (dont_blame_nrpe=1 / NSClient++ "allow arguments = true"): only use
## it when an alias on the agent is not practical.
##
## Each argument is quoted, so NSClient++ filters with spaces work. Pick the
## variant with the exact number of arguments (no empty argument is sent):
##   check_nrpe_3args!check_drivesize!drive=C:!warn=used gt 85%!crit=used gt 95%
## Shinken escapes: write "\!" for a literal "!", "$$" for "$". Keep
## "allow nasty characters" off on the agent: use gt/lt, not > / <.
define command {
    command_name    check_nrpe_1arg
    command_line    $NAGIOSPLUGINSDIR$/check_nrpe -H $HOSTADDRESS$ -t 30 -u -c $ARG1$ -a "$ARG2$"
}

define command {
    command_name    check_nrpe_2args
    command_line    $NAGIOSPLUGINSDIR$/check_nrpe -H $HOSTADDRESS$ -t 30 -u -c $ARG1$ -a "$ARG2$" "$ARG3$"
}

define command {
    command_name    check_nrpe_3args
    command_line    $NAGIOSPLUGINSDIR$/check_nrpe -H $HOSTADDRESS$ -t 30 -u -c $ARG1$ -a "$ARG2$" "$ARG3$" "$ARG4$"
}

# Former definition, unchanged for existing services: arguments are NOT
# quoted (an argument with spaces is split, missing ones are not sent).
define command {
    command_name    check_nrpe_args
    command_line    $NAGIOSPLUGINSDIR$/check_nrpe -H $HOSTADDRESS$ -t 9 -u -c $ARG1$ -a $ARG2$ $ARG3$ $ARG4$ $ARG5$
}
