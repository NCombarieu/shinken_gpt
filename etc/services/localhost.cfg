# Services du serveur Shinken (hôte « localhost »).
#
# Attention : les checks « locaux » (charge, disque) mesurent la machine qui
# EXÉCUTE le plugin, c'est-à-dire le conteneur poller, pas l'hôte Podman.
# Pour mesurer l'hôte lui-même, le superviser comme un serveur distant (SSH
# ou NRPE, voir services/exemples.cfg).

define service {
    use                     generic-service
    host_name               localhost
    service_description     Charge
    check_command           check_local_load!5.0,4.0,3.0!10.0,8.0,6.0
}

define service {
    use                     generic-service
    host_name               localhost
    service_description     Disque racine
    check_command           check_local_disk!20%!10%!/
}

# Interface web minimale du broker (module status-webui). « broker » est le
# nom du conteneur sur le réseau Podman ; hors conteneur, remplacer par
# 127.0.0.1.
define service {
    use                     generic-service
    host_name               localhost
    service_description     WebUI Shinken
    check_command           check_local_http!broker!8080!/healthz
}

# Port Livestatus du broker (utilisé par Thruk et shinken-healthcheck).
define service {
    use                     generic-service
    host_name               localhost
    service_description     Livestatus
    check_command           check_local_tcp!broker!50000
}
