#===============================================================================
# SCHEDULER (ordonnanceur)
#===============================================================================
# Le scheduler reçoit de l'arbiter sa part de la configuration (hôtes et
# services) et :
# - calcule l'arbre des dépendances ;
# - planifie les checks et les confie aux pollers ;
# - calcule les états (SOFT/HARD, flapping, maintenances, acquittements) ;
# - demande notifications et gestionnaires d'événements aux reactionners ;
# - transmet résultats, états et journaux aux brokers.
#===============================================================================
define scheduler {
    scheduler_name      scheduler-master    ; Nom du daemon
    address             localhost   ; Adresse IP ou nom DNS du daemon
    port                7768        ; Port TCP du daemon

    ## Facultatif
    spare               0   ; 1 = scheduler de secours, 0 = scheduler actif
    weight              1   ; Poids relatif pour répartir les hôtes entre schedulers
    timeout             3   ; Délai de réponse au ping (secondes)
    data_timeout        120 ; Délai d'envoi des données (secondes)
    max_check_attempts  3   ; Déclaré mort après N pings en échec
    check_interval      60  ; Ping toutes les N secondes

    ## Modules (séparés par des virgules)
    # - retention-pickle : conserve états, acquittements, maintenances et
    #   commentaires entre deux redémarrages (etc/modules/retention-pickle.cfg).
    #   Sans module de rétention, tout repart de zéro à chaque redémarrage ou
    #   rechargement de la configuration, et les notifications sont renvoyées.
    modules             retention-pickle

    ## Fonctions avancées
    # Royaume (multi-sites)
    realm   All

    # 1 = ne pas envoyer l'état initial complet aux brokers au démarrage.
    # Démarrage plus rapide, mais livestatus et status-webui ont besoin de
    # cet état initial : laisser à 0.
    skip_initial_broks  0

    # Derrière une traduction d'adresses (NAT), adresse ip[:port] de chaque
    # satellite telle que vue par ce scheduler (si le port est omis, celui
    # déclaré par le satellite est utilisé).
    #satellitemap    poller-1=192.0.2.21:7771, reactionner-1=192.0.2.22:7769

    # 1 = HTTPS entre daemons
    use_ssl               0
    # 1 = vérifie que le certificat correspond au nom du daemon (anti
    # interception)
    hard_ssl_name_check   0
}
