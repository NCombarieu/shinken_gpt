# Macros de ressource pour les checks Active Directory / LDAP.
#
# Les macros de ressource ($NOM$) sont globales et n'apparaissent pas dans les
# interfaces web : c'est l'endroit où placer les identifiants techniques.
# Valeurs d'exemple À REMPLACER ; ne jamais versionner de vrai mot de passe
# dans un dépôt public (voir doc/exploitation/09-securite.md).
$DOMAIN$=EXEMPLE
$DOMAINUSERSHORT$=svc-supervision
$DOMAINUSER$=$DOMAIN$\\$DOMAINUSERSHORT$
$DOMAINPASSWORD$=changez-moi
$LDAPBASE$=dc=example,dc=com
