# Communauté SNMP (v2c) en lecture utilisée par défaut par les checks SNMP.
# Le modèle generic-host la reprend dans sa macro _SNMPCOMMUNITY, que chaque
# hôte peut redéfinir. « public » est la valeur d'usine des équipements :
# la remplacer par la communauté réelle de votre parc.
$SNMPCOMMUNITYREAD$=public
