# Paramètres des checks par SSH (commande check_by_ssh).
# Recette : doc/admin/recettes/linux-ssh.md
#
# Compte utilisé sur les serveurs supervisés.
$SSHUSER$=supervision
# Clé privée, vue depuis le conteneur poller. Le dossier etc/ssh_keys/ du dépôt
# est monté sur /etc/shinken/ssh_keys/ ; la clé n'est jamais versionnée.
$SSHKEY$=/etc/shinken/ssh_keys/id_ed25519
