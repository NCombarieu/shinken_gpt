# Paramètres de la découverte réseau par nmap (outil shinken-discovery,
# voir doc/admin/23-decouverte.md).
#
# Cibles à scanner par défaut : réseaux ou hôtes séparés par des espaces.
# 192.0.2.0/24 est une plage de documentation (RFC 5737) : la remplacer par
# un réseau que vous êtes autorisé à scanner.
$NMAPTARGETS$=192.0.2.0/24
# Si les scans sont trop lents : augmenter le débit minimal (paquets en
# parallèle) et réduire le nombre de nouvelles tentatives.
$NMAPMINRATE$=1000
$NMAPMAXRETRIES$=3
