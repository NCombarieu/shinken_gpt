# Relais SMTP utilisé par notify_by_email.py (commandes notify-*-by-email et
# detailled-*-by-email). Le conteneur n'embarque pas de serveur de messagerie :
# indiquez ici un relais joignable depuis le conteneur reactionner.
#
# Pour l'authentification et le chiffrement, ajoutez aux command_line :
#   --smtp-starttls (ou --smtp-ssl) --smtp-user <compte>
#   --smtp-password-file /run/secrets/smtp_password
# Ne mettez jamais le mot de passe lui-même dans une macro : il apparaîtrait
# dans la liste des processus et dans les logs.

# Nom ou adresse du relais SMTP
$SMTP_HOST$=smtp.example.com
# Port du relais (25 en clair ou STARTTLS, 587 soumission, 465 SMTPS)
$SMTP_PORT$=25
# Adresse d'expéditeur des notifications
$MAIL_FROM$=shinken@example.com
