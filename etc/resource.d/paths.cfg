# Chemins des plugins et scripts, utilisés dans les command_line.
# Valeurs adaptées à l'image conteneur ; à ajuster pour une installation native.

# Plugins standard (paquet Debian monitoring-plugins : check_ping, check_http, ...)
$NAGIOSPLUGINSDIR$=/usr/lib/nagios/plugins
# Macro historique Nagios, conservée pour la compatibilité des confs existantes
$USER1$=$NAGIOSPLUGINSDIR$

# Scripts fournis par Shinken (notify_by_email.py, discovery/, ...)
$PLUGINSDIR$=/usr/local/lib/shinken/libexec

# Scripts de check maison de l'administrateur : dossier ./plugins-local/ du
# dépôt, monté en lecture seule dans les conteneurs poller et reactionner.
$LOCALPLUGINSDIR$=/usr/local/lib/shinken/plugins-local
