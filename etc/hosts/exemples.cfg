# Exemples d'hôtes, désactivés (commentés).
#
# Pour en activer un : copier le bloc dans un nouveau fichier (par exemple
# hosts/srv-linux-01.cfg), retirer les « # », adapter le nom et l'adresse,
# puis recharger la configuration (voir doc/admin/01-demarrage-rapide.md).
#
# Les adresses 192.0.2.0/24 sont réservées à la documentation (RFC 5737) :
# elles ne correspondent à aucune machine réelle.
#
# Les services associés à ces exemples sont dans services/exemples.cfg.

# --- Serveur Linux supervisé par SSH (clé restreinte) ou par NRPE ----------
# Recettes : doc/admin/recettes/linux-ssh.md et doc/admin/recettes/linux-nrpe.md
#define host {
#    use                     generic-host
#    host_name               srv-linux-01
#    alias                   Serveur Linux d'exemple
#    address                 192.0.2.10
#    hostgroups              linux
#}

