# Hotes externes juste pour avoir du contenu a regarder dans Thruk.
# check_command en check_tcp!443 plutot que ping (le poller a bien CAP_NET_RAW
# depuis compose.yaml) : on veut verifier que le service ecoute, pas juste
# que l'IP repond a un ping.

define host{
        use                     generic-host
        host_name               google.fr
        address                 google.fr
        check_command           check_tcp!443
        }

define host{
        use                     generic-host
        host_name               github.com
        address                 github.com
        check_command           check_tcp!443
        }

define host{
        use                     generic-host
        host_name               anthropic.com
        address                 anthropic.com
        check_command           check_tcp!443
        }

define host{
        use                     generic-host
        host_name               cloudflare-dns
        address                 1.1.1.1
        check_command           check_tcp!53
        }
