# Hotes externes juste pour avoir du contenu a regarder dans Thruk.
# check_command en check_tcp!443 : check_host_alive (ping) ne marche pas
# ici, le container poller n'a pas CAP_NET_RAW (cap_drop: ALL dans
# compose.yaml) -> meme raison que pour localhost.cfg.

define host{
        use                     generic-host
        host_name               google.fr
        address                 google.fr
        check_command           check_tcp!443
        }

define host{
        use                     generic-host
        host_name               github.com
        address                 github.com
        check_command           check_tcp!443
        }

define host{
        use                     generic-host
        host_name               anthropic.com
        address                 anthropic.com
        check_command           check_tcp!443
        }

define host{
        use                     generic-host
        host_name               cloudflare-dns
        address                 1.1.1.1
        check_command           check_tcp!53
        }
