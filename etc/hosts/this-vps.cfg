# Ce serveur (l'hote qui fait tourner les containers Shinken), joint
# via le nom special de Podman rootless pour parler a son propre hote
# depuis un container -- pas une IP de bridge classique, voir
# DEPLOYMENT.md pour le detail (host.containers.internal).
define host{
        use                     generic-host
        host_name               this-vps
        address                 host.containers.internal
        check_command           check_tcp!22
        }
