define host{
        use                     generic-host
	contact_groups		admins
        host_name               localhost
        address                 localhost
        # ping needs CAP_NET_RAW, dropped on purpose by the poller container
        # (cap_drop: ALL in compose.yaml) -> check broker reachability instead
        check_command           check_local_http!broker!8080!/api/status
        }


