# Hôte « localhost » : le serveur Shinken lui-même.
#
# En déploiement conteneur, les checks sont exécutés par le poller : pour lui,
# 127.0.0.1 désigne son propre conteneur. Le ping ci-dessous vérifie donc que
# le poller est capable d'exécuter un check ICMP (il dispose de la capacité
# NET_RAW, voir compose.yaml). Les services associés sont dans
# services/localhost.cfg.
#
# Pour superviser d'autres machines, voir les exemples commentés de
# hosts/exemples.cfg et la documentation : doc/admin/01-demarrage-rapide.md.

define host {
    use                     generic-host
    host_name               localhost
    alias                   Serveur Shinken
    address                 127.0.0.1
    check_command           check_host_alive
    hostgroups              shinken
}
