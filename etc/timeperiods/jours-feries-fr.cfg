# Jours fériés français à date fixe.
#
# Cette période ne sert pas seule : on l'EXCLUT d'une autre période, par
# exemple « heures ouvrées hors jours fériés » (voir workhours.cfg).
# « 00:00-24:00 » couvre la journée entière.
#
# Les fêtes mobiles (lundi de Pâques, Ascension, lundi de Pentecôte) changent
# chaque année : les ajouter sous forme datée, par exemple
#     2027-03-29              00:00-24:00     ; Lundi de Pâques 2027
# et les mettre à jour chaque année. Syntaxe complète :
# doc/admin/18-periodes-de-temps.md.
define timeperiod {
    timeperiod_name     jours-feries-fr
    alias               Jours fériés (France, dates fixes)

    january 1           00:00-24:00     ; Jour de l'an
    may 1               00:00-24:00     ; Fête du travail
    may 8               00:00-24:00     ; Victoire 1945
    july 14             00:00-24:00     ; Fête nationale
    august 15           00:00-24:00     ; Assomption
    november 1          00:00-24:00     ; Toussaint
    november 11         00:00-24:00     ; Armistice 1918
    december 25         00:00-24:00     ; Noël
}
