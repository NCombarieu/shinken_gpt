# Heures ouvrées : du lundi au vendredi, 9 h - 18 h, hors jours fériés.
# Les heures s'entendent dans le fuseau horaire des daemons (variable TZ du
# déploiement, voir doc/exploitation/02-configuration.md).
define timeperiod {
    timeperiod_name     workhours
    alias               Heures ouvrées
    monday              09:00-18:00
    tuesday             09:00-18:00
    wednesday           09:00-18:00
    thursday            09:00-18:00
    friday              09:00-18:00
    exclude             jours-feries-fr
}
