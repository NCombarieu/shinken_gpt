#===============================================================================
# RECEIVER
#===============================================================================
# Le receiver collecte les informations passives (commandes externes,
# résultats passifs) reçues par ses modules et les transmet à l'arbiter, ou
# directement aux schedulers si direct_routing est activé.
#===============================================================================
define receiver {
    receiver_name   receiver-master
    address         localhost   ; Adresse IP ou nom DNS du daemon
    port            7773        ; Port TCP du daemon
    spare           0           ; 1 = receiver de secours, 0 = receiver actif

    ## Facultatif
    timeout             3   ; Délai de réponse au ping (secondes)
    data_timeout        120 ; Délai d'envoi des données (secondes)
    max_check_attempts  3   ; Déclaré mort après N pings en échec
    check_interval      60  ; Ping toutes les N secondes

    ## Modules (séparés par des virgules)
    # - named-pipe : fichier de commandes externes nagios.cmd
    #   (etc/modules/named-pipe.cfg), si le tube doit se trouver sur la
    #   machine du receiver plutôt que sur celle de l'arbiter.
    modules

    # 1 = HTTPS entre daemons
    use_ssl               0
    # 1 = vérifie que le certificat correspond au nom du daemon
    hard_ssl_name_check   0

    ## Fonctions avancées
    direct_routing      0   ; 1 = envoie directement les commandes aux
                            ; schedulers qui gèrent l'hôte concerné
    realm   All
}
