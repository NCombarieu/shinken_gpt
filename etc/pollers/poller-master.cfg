#===============================================================================
# POLLER
#===============================================================================
# Le poller récupère les checks à exécuter auprès des schedulers, lance les
# plugins de supervision et renvoie les résultats.
#===============================================================================
define poller {
    poller_name     poller-master
    address         localhost   ; Adresse IP ou nom DNS du daemon
    port            7771        ; Port TCP du daemon

    ## Facultatif
    spare               0   ; 1 = poller de secours, 0 = poller actif
    manage_sub_realms   0   ; Prend aussi les checks des sous-royaumes
    min_workers         0   ; Nombre de processus au démarrage (0 = 1 par CPU)
    max_workers         0   ; Nombre maximal de processus (0 = 1 par CPU)
    processes_by_worker 256 ; Checks simultanés par processus
    polling_interval    1   ; Demande du travail toutes les N secondes
    timeout             3   ; Délai de réponse au ping (secondes)
    data_timeout        120 ; Délai d'envoi des données (secondes)
    max_check_attempts  3   ; Déclaré mort après N pings en échec
    check_interval      60  ; Ping toutes les N secondes

    ## Modules (séparés par des virgules). Aucun module de poller n'est
    ## fourni : les checks sont exécutés directement.
    modules

    ## Fonctions avancées
    # 1 = mode passif (DMZ) : c'est le scheduler qui contacte le poller.
    #passive         0

    # Étiquettes (poller_tag) des checks pris en charge ; « None » désigne
    # les checks sans étiquette.
    #poller_tags     None

    # 1 = HTTPS entre daemons
    use_ssl               0
    # 1 = vérifie que le certificat correspond au nom du daemon
    hard_ssl_name_check   0

    realm   All
}
