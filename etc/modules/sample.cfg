#===============================================================================
# Modèle de déclaration d'un module
#===============================================================================
# Un module se déclare avec un nom (module_name, à citer dans la ligne
# « modules » d'un daemon) et un type (module_type, fourni par le code du
# module présent dans modules_dir). Les autres paramètres sont propres à
# chaque module. Exemple inactif :
#
#define module {
#    module_name    mon-module
#    module_type    mon_type
#    parametre1     valeur1
#}
