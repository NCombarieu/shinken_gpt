#===============================================================================
# MODULE status-webui
#===============================================================================
# Chargé par : le broker (ligne « modules » de etc/brokers/broker-master.cfg).
#
# Petite interface web en lecture seule : tableau de bord HTML (/), état au
# format JSON (/api/status) et sonde de vie (/healthz). Ce n'est pas
# l'ancienne WebUI de Shinken : pour une interface complète, utiliser Thruk
# avec le module livestatus.
#
# Sécurité : pas d'authentification. Ne pas exposer hors d'un réseau de
# confiance (ou placer derrière un proxy inverse qui authentifie).
#===============================================================================
define module {
    module_name     status-webui
    module_type     status_webui

    # Adresse et port d'écoute HTTP. Défaut : 127.0.0.1 et 8080
    host            0.0.0.0
    port            8080
}
