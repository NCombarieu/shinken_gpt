#===============================================================================
# MODULE named-pipe (fichier de commandes nagios.cmd)
#===============================================================================
# Chargé par : l'arbiter ou un receiver (ligne « modules » de
# etc/arbiters/*.cfg ou etc/receivers/*.cfg).
#
# Crée un tube nommé (FIFO) et lit les commandes externes qui y sont écrites,
# une par ligne, au format Nagios :
#
#     printf '[%s] SCHEDULE_FORCED_SVC_CHECK;web-01;HTTP;%s\n' \
#         "$(date +%s)" "$(date +%s)" > /var/lib/shinken/nagios.cmd
#
# Permet aux scripts d'exploitation, passerelles NSCA, interfaces web en mode
# « fichier de commandes », etc. de continuer à piloter Shinken comme avec
# Nagios. Les commandes externes restent aussi disponibles via Livestatus.
#
# Activation, au choix :
# - ajouter « named-pipe » à la ligne « modules » de l'arbiter ;
# - ou définir « command_file=/var/lib/shinken/nagios.cmd » dans shinken.cfg :
#   l'arbiter crée alors automatiquement ce module (NamedPipe-Autogenerated).
#
# Sécurité : quiconque peut écrire dans le tube peut piloter la supervision
# (acquittements, maintenances, désactivation des notifications...). Le tube
# est créé avec les droits 0660 : seuls l'utilisateur et le groupe du daemon
# peuvent y écrire. Il est supprimé à l'arrêt du daemon.
#===============================================================================
define module {
    module_name     named-pipe
    module_type     named_pipe

    # Chemin du tube nommé (le dossier est créé si besoin ; un fichier
    # ordinaire présent à cet emplacement est remplacé).
    # Défaut : /var/lib/shinken/nagios.cmd
    command_file    /var/lib/shinken/nagios.cmd
}
