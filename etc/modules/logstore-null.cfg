#===============================================================================
# MODULE logstore-null (sous-module de livestatus)
#===============================================================================
# Chargé par : le module livestatus (broker).
#
# Stockage « vide » de l'historique : les journaux ne sont pas conservés et la
# table Livestatus « log » est toujours vide. À utiliser quand l'historique
# n'est pas nécessaire ; sinon préférer logstore-sqlite. C'est aussi le repli
# automatique de livestatus quand le sous-module configuré est indisponible.
#===============================================================================
define module {
    module_name     logstore-null
    module_type     logstore_null
}
