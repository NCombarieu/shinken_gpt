#===============================================================================
# MODULE livestatus
#===============================================================================
# Chargé par : le broker (ligne « modules » de etc/brokers/broker-master.cfg).
#
# Expose l'état de la supervision avec le protocole Livestatus (MK Livestatus),
# utilisé notamment par Thruk, NagVis et les scripts d'exploitation, et
# accepte les commandes externes (COMMAND [horodatage] ...).
#
# Test rapide :
#     printf 'GET hosts\nColumns: name state\n\n' | nc 127.0.0.1 50000
#
# Sécurité : le protocole n'a pas d'authentification. N'exposez pas le port
# hors d'un réseau de confiance, ou limitez les clients avec « allowed_hosts ».
#===============================================================================
define module {
    module_name     livestatus
    module_type     livestatus

    # Adresse et port TCP d'écoute (« * » ou 0.0.0.0 = toutes les interfaces).
    host            0.0.0.0
    port            50000

    # Socket Unix supplémentaire (facultatif), par ex. pour Thruk en local.
    #socket          /var/lib/shinken/rw/live

    # Liste d'adresses IPv4 autorisées, séparées par des virgules.
    # Défaut : vide = toutes les adresses.
    #allowed_hosts   127.0.0.1, 192.0.2.10

    # Sous-module de stockage de l'historique (table « log ») :
    # - logstore-sqlite : historique conservé dans SQLite (recommandé) ;
    # - logstore-null   : pas d'historique.
    # Si le sous-module est introuvable, livestatus se rabat sur logstore-null.
    modules         logstore-sqlite

    # Dossier des données PNP4Nagios, pour la colonne « pnpgraph_present ».
    #pnp_path        /var/lib/pnp4nagios/perfdata

    # Contrôle d'accès des contacts (paramètre AuthUser de Livestatus) :
    # - service_authorization loose : un contact voit tous les services des
    #   hôtes qu'il voit ; strict : seulement ses propres services ;
    # - group_authorization strict : un contact voit un groupe s'il en voit
    #   tous les membres ; loose : s'il en voit au moins un.
    #service_authorization   loose
    #group_authorization     strict

    # 1 = active le cache des requêtes. Défaut : 0
    #query_cache     0
}
