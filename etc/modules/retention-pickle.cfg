#===============================================================================
# MODULE retention-pickle
#===============================================================================
# Chargé par : le scheduler (ligne « modules » de etc/schedulers/*.cfg).
#
# Conserve l'état de la supervision entre deux redémarrages du scheduler ou
# deux rechargements de la configuration : états et sorties des hôtes et
# services, acquittements, périodes de maintenance (downtimes), commentaires,
# notifications en cours, attributs modifiés par commande externe...
# Sans module de rétention, tout repart de zéro (PENDING) et les
# notifications sont renvoyées, y compris pour les éléments acquittés.
#
# Le fichier est sauvegardé toutes les « retention_update_interval » minutes
# (shinken.cfg, 60 par défaut) et à l'arrêt du scheduler, puis relu au
# démarrage. L'écriture est atomique : un arrêt brutal ne laisse jamais un
# fichier tronqué.
#
# Migration depuis Shinken 2.4 (Python 2) : le fichier retention.dat produit
# par l'ancien module pickle-retention-file-scheduler est relu directement
# (textes UTF-8, avec repli latin-1 pour les anciennes sorties de plugins).
# Il suffit de le copier à l'emplacement indiqué par « path ».
#===============================================================================
define module {
    module_name     retention-pickle
    module_type     pickle_retention_file

    # Fichier de rétention (le dossier doit être accessible en écriture par
    # l'utilisateur du scheduler). Défaut : /var/lib/shinken/retention.dat
    path            /var/lib/shinken/retention.dat

    # Version du format pickle. 2 (défaut) reste lisible par Shinken 2.4 en
    # cas de retour arrière ; une valeur plus élevée est un peu plus compacte.
    #pickle_protocol 2
}
