# NON UTILISABLE EN L'ETAT : le module logstore_sqlite n'est pas livre dans
# modules/ (pas encore porte en Python 3). Ne pas le referencer dans
# livestatus.cfg tant qu'il n'existe pas, sinon Livestatus plante en boucle.
define module{
    module_name     logstore-sqlite
    module_type     logstore_sqlite
    database_file   /var/lib/shinken/livestatus.db3
    max_logs_age    90
}
