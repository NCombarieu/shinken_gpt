#===============================================================================
# MODULE logstore-sqlite (sous-module de livestatus)
#===============================================================================
# Chargé par : le module livestatus (broker), via sa ligne « modules ».
#
# Enregistre dans une base SQLite tous les journaux de supervision (alertes,
# notifications, changements d'état, commandes externes, checks passifs...)
# et répond aux requêtes Livestatus « GET log ». C'est ce qui alimente dans
# Thruk le journal des événements, l'historique des alertes et des
# notifications et les rapports de disponibilité.
#
# Fonctionnement :
# - les lignes du jour sont écrites dans « database_file » ;
# - chaque nuit à 00h05 (et au démarrage), les lignes des jours précédents
#   sont déplacées dans une base par jour : <archive_path>/<nom>-AAAA-MM-JJ.db ;
# - les lignes et archives plus anciennes que « max_logs_age » sont supprimées.
# Le format est celui du module Shinken 2.4 : une base et des archives
# existantes peuvent être reprises telles quelles.
#
# Si ce module ne peut pas être chargé ou si la base ne peut pas être ouverte,
# Livestatus continue de fonctionner avec un journal vide (logstore-null) et
# l'erreur est indiquée dans le journal du broker.
#===============================================================================
define module {
    module_name     logstore-sqlite
    module_type     logstore_sqlite

    # Base SQLite courante (créée si absente, ainsi que son dossier).
    # Défaut : /var/lib/shinken/livestatus.db
    database_file   /var/lib/shinken/livestatus.db

    # Dossier des archives journalières.
    # Défaut : dossier « archives » à côté de database_file.
    archive_path    /var/lib/shinken/archives/

    # Durée de conservation : <nombre>[d|w|m|y] (jours, semaines, mois de
    # 31 jours, années). 0 = conservation illimitée. Défaut : 1y
    max_logs_age    3m

    # 1 = transmettre aussi à SQLite les filtres autres que la date (hôte,
    # type, état...). Plus rapide sur de gros historiques ; le résultat est
    # identique car Livestatus applique toujours les filtres exacts ensuite.
    # Défaut : 0 (seule la plage de dates est filtrée par SQLite)
    #use_aggressive_sql  1

    # 1 = lecture seule : utile quand plusieurs modules livestatus lisent la
    # même base et qu'un seul l'alimente. Défaut : 0
    #read_only       1

    # Mode de journal SQLite : delete, truncate, persist, memory, wal, off.
    # « wal » permet les lectures pendant l'écriture. Défaut : wal
    #journal_mode    wal
}
