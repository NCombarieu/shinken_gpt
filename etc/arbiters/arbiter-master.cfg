#===============================================================================
# ARBITER
#===============================================================================
# L'arbiter :
# - lit, vérifie et découpe la configuration, puis la distribue aux autres
#   daemons ;
# - surveille les autres daemons et active les daemons de secours (spare) ;
# - transmet aux schedulers les commandes externes qu'il reçoit.
#===============================================================================
# IMPORTANT : avec plusieurs arbiters (maître + secours), renseigner sur
# chacun host_name avec le vrai nom de la machine (commande « hostname »).
#===============================================================================
define arbiter {
    arbiter_name    arbiter-master
    #host_name       node1       ; À définir s'il y a plusieurs arbiters
    address         localhost   ; Adresse IP ou nom DNS du daemon
    port            7770        ; Port TCP du daemon
    spare           0           ; 1 = arbiter de secours, 0 = arbiter maître

    ## Modules (séparés par des virgules)
    # - named-pipe : fichier de commandes externes nagios.cmd
    #   (etc/modules/named-pipe.cfg). Il est aussi créé automatiquement si
    #   « command_file » est défini dans shinken.cfg.
    modules

    # 1 = HTTPS entre daemons
    use_ssl               0
    # 1 = vérifie que le certificat correspond au nom du daemon
    hard_ssl_name_check   0

    ## En haute disponibilité, décommenter pour que le maître et les secours
    ## sachent combien de temps s'attendre.
    #timeout              3   ; Délai de réponse au ping (secondes)
    #data_timeout         120 ; Délai d'envoi des données (secondes)
    #max_check_attempts   3   ; Déclaré mort après N pings en échec
    #check_interval       60  ; Ping toutes les N secondes
}
