# Contact administrateur par défaut.
#
# À FAIRE AVANT TOUTE MISE EN SERVICE :
#   - remplacer l'adresse e-mail par une adresse réelle de l'équipe ;
#   - changer le mot de passe (utilisé uniquement par les interfaces web qui
#     s'authentifient auprès de Shinken ; avec Thruk, l'authentification est
#     gérée par Thruk et ce champ n'est pas utilisé).
#
# Le nom du contact (contact_name) doit être identique à l'identifiant de
# connexion dans Thruk : Livestatus filtre ce qu'un utilisateur voit selon les
# contacts des hôtes et services.

define contact {
    use             generic-contact
    contact_name    admin
    alias           Administrateur de la supervision
    contactgroups   admins
    email           admin@example.com
    password        changez-moi
    is_admin        1
}
