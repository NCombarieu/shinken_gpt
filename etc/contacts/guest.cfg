# Contact en lecture seule, sans notification : exemple de compte de
# consultation. Le supprimer s'il n'est pas utilisé, sinon changer son mot de
# passe.

define contact {
    use                             generic-contact
    contact_name                    guest
    alias                           Consultation (lecture seule)
    contactgroups                   users
    email                           guest@example.com
    password                        changez-moi
    can_submit_commands             0
    host_notifications_enabled      0
    service_notifications_enabled   0
}
