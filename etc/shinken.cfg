# Fichier principal de configuration, lu par l'arbiter.
#
# Il liste les dossiers à charger (cfg_dir) et fixe les paramètres globaux.
# Tout fichier .cfg placé dans un de ces dossiers, sous-dossiers compris, est
# chargé automatiquement. Référence des directives :
# doc/admin/reference/directives-shinken-cfg.md

# --- Objets communs : commandes, périodes, escalades, dépendances ----------
cfg_dir=commands
cfg_dir=timeperiods
cfg_dir=escalations
cfg_dir=dependencies

# --- Modèles d'hôtes, de services et de contacts --------------------------
cfg_dir=templates

# --- Modes de notification -------------------------------------------------
cfg_dir=notificationways

# --- Groupes ---------------------------------------------------------------
cfg_dir=servicegroups
cfg_dir=hostgroups
cfg_dir=contactgroups

# --- Objets supervisés et contacts -----------------------------------------
cfg_dir=hosts
cfg_dir=services
cfg_dir=contacts
cfg_dir=packs

# --- Modules et daemons ----------------------------------------------------
cfg_dir=modules
cfg_dir=arbiters
cfg_dir=schedulers
cfg_dir=pollers
cfg_dir=reactionners
cfg_dir=brokers
cfg_dir=receivers
cfg_dir=realms

# --- Macros globales ($USER1$, $NAGIOSPLUGINSDIR$, identifiants...) --------
cfg_dir=resource.d

# --- Ordonnancement --------------------------------------------------------
# Intervalle (en minutes) entre deux sauvegardes de l'état par le module de
# rétention du scheduler (en plus de la sauvegarde à l'arrêt).
retention_update_interval=60

# Au démarrage, les premiers checks sont étalés sur ce nombre de minutes pour
# éviter un pic de charge. Un hôte ou service reste donc PENDING jusqu'à
# 5 minutes après un (re)démarrage : c'est normal.
max_service_check_spread=5
max_host_check_spread=5

# Durée maximale (en secondes) d'un check de service. Au-delà, le plugin est
# tué et le service prend l'état timeout_exit_status (2 = CRITICAL) avec la
# sortie « (Service Check Timed Out) ».
# Les checks d'hôte ont leur propre limite, host_check_timeout (30 s par défaut).
service_check_timeout=60
timeout_exit_status=2

# Nombre d'états mémorisés pour détecter le flapping (changements d'état
# trop fréquents). Coût mémoire : 4 octets x flap_history x (hôtes + services),
# soit environ 900 Ko pour 1 000 hôtes et 10 000 services.
flap_history=20

# Taille maximale (en octets) de la sortie d'un plugin conservée.
max_plugins_output_length=65536

# Passer en UNREACHABLE (hôtes) ou UNKNOWN (services) les éléments qui
# dépendent d'un parent en panne, au lieu de les déclarer eux-mêmes en panne
# (voir doc/admin/13-dependances-escalades.md). Défaut si absent : 0.
enable_problem_impacts_states_change=1

# 1 = ne plus avertir des anciens paramètres Nagios ignorés par Shinken.
disable_old_nagios_parameters_whining=0

# Fuseau horaire des daemons. En conteneur, préférer la variable TZ du
# déploiement (doc/exploitation/02-configuration.md).
#use_timezone=Europe/Paris

# Macros d'environnement (NAGIOS_*) pour les plugins : coûteuses, désactivées.
enable_environment_macros=0

# Ne pas journaliser les états initiaux au démarrage.
log_initial_states=0

# Pas d'event handler pendant une période de maintenance (downtime).
# Mettre 0 pour retrouver le comportement de Nagios.
no_event_handlers_during_downtimes=1

# Mémorise l'affectation des hôtes aux schedulers entre deux redémarrages,
# pour garder chaque hôte sur le même scheduler.
pack_distribution_file=/var/lib/shinken/pack_distribution.dat

# Tube nommé des commandes externes (nagios.cmd). Décommenter pour que
# l'arbiter le crée (module named-pipe, voir
# doc/admin/15-checks-passifs-commandes-externes.md).
#command_file=/var/lib/shinken/nagios.cmd


# --- Paramètres propres au daemon arbiter ----------------------------------
# (les autres daemons ont les leurs dans daemons/*.ini)

# Répertoire de travail ; par défaut celui du fichier de verrou.
workdir=/var/run/shinken

# Fichier de verrou contenant le PID de l'arbiter.
lock_file=/var/run/shinken/arbiterd.pid

# Journal local de l'arbiter.
local_log=/var/log/shinken/arbiterd.log

# Niveau de journalisation : DEBUG, INFO, WARNING, ERROR ou CRITICAL.
#log_level=WARNING

# Compte système sous lequel tourne l'arbiter (inutile en conteneur, qui
# s'exécute déjà sous l'utilisateur shinken).
#shinken_user=shinken
#shinken_group=shinken

# Répertoire des modules. En conteneur, il est remplacé au démarrage par
# /usr/local/lib/shinken/modules (variable SHINKEN_MODULES_DIR).
modules_dir=/var/lib/shinken/modules

# 0 = ne pas lancer ce daemon (arbiter).
daemon_enabled=1

# --- Chiffrement des échanges entre daemons --------------------------------
# Désactivé : les daemons doivent communiquer sur un réseau privé (réseau
# Podman, VPN). Les certificats de certs/ sont des exemples de démonstration,
# à ne jamais utiliser en production (voir doc/exploitation/09-securite.md).
use_ssl=0
# Chemins complets obligatoires.
ca_cert=/etc/shinken/certs/ca.pem
server_cert=/etc/shinken/certs/server.cert
server_key=/etc/shinken/certs/server.key
hard_ssl_name_check=0

# Serveur HTTP des daemons : Cheroot est toujours utilisé, quelle que soit la
# valeur (directive conservée pour compatibilité).
http_backend=auto


# --- Statistiques internes vers un serveur StatsD ---------------------------
# Envoie en UDP les métriques de fonctionnement de Shinken (files d'attente,
# temps de traitement), avec le préfixe « shinken ».
statsd_enabled=0
statsd_interval=10
statsd_host=localhost
statsd_port=8125
statsd_prefix=shinken
statsd_pattern=shinken.{name}.{metric}
statsd_types=system,queue,object,perf
