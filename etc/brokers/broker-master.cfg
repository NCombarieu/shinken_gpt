#===============================================================================
# BROKER
#===============================================================================
# Le broker reçoit des schedulers (et de l'arbiter) les états, résultats et
# journaux, et les met à disposition par ses modules : interface Livestatus
# (Thruk, NagVis, scripts), interface web d'état, historique des événements.
#===============================================================================
define broker {
    broker_name     broker-master
    address         localhost   ; Adresse IP ou nom DNS du daemon
    port            7772        ; Port TCP du daemon
    spare           0           ; 1 = broker de secours, 0 = broker actif

    ## Facultatif
    manage_arbiters     1   ; Reçoit aussi les données de l'arbiter. Un seul
                            ; broker doit le faire.
    manage_sub_realms   1   ; Prend aussi en charge les schedulers des
                            ; sous-royaumes
    timeout             3   ; Délai de réponse au ping (secondes)
    data_timeout        120 ; Délai d'envoi des données (secondes)
    max_check_attempts  3   ; Déclaré mort après N pings en échec
    check_interval      60  ; Ping toutes les N secondes

    ## Modules (séparés par des virgules)
    # - livestatus   : interface Livestatus (port 50000), avec l'historique
    #                  stocké par logstore-sqlite (etc/modules/livestatus.cfg)
    # - status-webui : petite interface web d'état (port 8080)
    # Attention : après une modification de cette ligne ou de la définition
    # d'un module du broker, redémarrer le broker (le rechargement de l'arbiter
    # ne recharge pas les modules du broker).
    modules             livestatus,status-webui

    # 1 = HTTPS entre daemons
    use_ssl               0
    # 1 = vérifie que le certificat correspond au nom du daemon
    hard_ssl_name_check   0

    ## Fonctions avancées
    realm   All
}
