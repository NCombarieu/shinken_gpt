## InfluxDB TimeSeries Configuration for Shinken Broker
#
# This module exports performance metrics (perfdata) to InfluxDB
# for use with Grafana dashboards, trending, and alerting.
#
# See doc/METRICS.md for complete setup and integration guide.

define broker {
    broker_name     broker-timeseries
    address         localhost
    port            7772
    spare           0
    modules         broker_timeseries
    realm           All
}

## InfluxDB Connection Configuration
#
# Write performance metrics to InfluxDB for visualization in Grafana.
# This is separate from Livestatus (which stores events/logs).

[broker_timeseries]
module_type                 = broker_timeseries
module_alias                = InfluxDB TimeSeries Export

# InfluxDB Server Connection
influx_host                 = localhost          # InfluxDB hostname
influx_port                 = 8086               # InfluxDB HTTP API port
influx_database             = shinken            # InfluxDB database (bucket)
influx_username             = admin              # InfluxDB user
influx_password             = password           # InfluxDB password (or token if using auth tokens)
influx_ssl                  = 0                  # 1 for HTTPS, 0 for HTTP
influx_timeout              = 10                 # Connection timeout in seconds

# Measurement Names (metric prefixes in InfluxDB)
# These are the names that appear in InfluxDB and Grafana
influx_measurement_prefix   = check_             # Prepended to all metric names
influx_host_tag             = host               # Tag name for host
influx_service_tag          = service            # Tag name for service

# Performance Tuning
influx_batch_size           = 100                # Write metrics in batches
influx_batch_timeout        = 5                  # Send batch after N seconds (even if not full)
influx_precision            = ns                 # Timestamp precision: ns, us, ms, s

# Data Retention (can also be configured in InfluxDB directly)
# Default: 30 days of metrics
influx_retention            = 30d                # Keep metrics for 30 days, then delete

# Enable/Disable Features
influx_enabled              = 1                  # 1 to enable, 0 to disable without reconfig
influx_log_perfdata         = 1                  # 1 to log metric writes to broker.log
influx_skip_missing_values  = 1                  # 1 to skip metrics with no value (avoid clutter)

# Logging
broker_log_file             = /var/log/shinken/broker-timeseries.log
broker_log_level            = info               # debug, info, warning, error
