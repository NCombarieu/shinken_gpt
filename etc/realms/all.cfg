# Realm (royaume) par défaut. Tous les hôtes et tous les daemons qui ne
# précisent pas de realm en font partie.
#
# Les realms servent à découper une supervision distribuée (plusieurs sites,
# chacun avec ses schedulers et pollers). Lire doc/admin/20-architecture-distribuee.md
# avant de modifier ce fichier.
define realm {
    realm_name  All
    default     1
}
