#===============================================================================
# REACTIONNER
#===============================================================================
# Le reactionner exécute les actions demandées par les schedulers :
# - les commandes de notification (mail, SMS...) ;
# - les gestionnaires d'événements (event handlers).
#===============================================================================
define reactionner {
    reactionner_name    reactionner-master
    address             localhost   ; Adresse IP ou nom DNS du daemon
    port                7769        ; Port TCP du daemon
    spare               0           ; 1 = reactionner de secours, 0 = actif

    ## Facultatif
    manage_sub_realms   0   ; Prend aussi les actions des sous-royaumes
    min_workers         1   ; Nombre de processus au démarrage (0 = 1 par CPU)
    max_workers         15  ; Nombre maximal de processus (0 = 1 par CPU)
    polling_interval    1   ; Demande du travail toutes les N secondes
    timeout             3   ; Délai de réponse au ping (secondes)
    data_timeout        120 ; Délai d'envoi des données (secondes)
    max_check_attempts  3   ; Déclaré mort après N pings en échec
    check_interval      60  ; Ping toutes les N secondes

    ## Modules (séparés par des virgules). Aucun module de reactionner n'est
    ## fourni : les commandes sont exécutées directement.
    modules

    # Étiquettes (reactionner_tag) des actions prises en charge ; « None »
    # désigne les actions sans étiquette.
    #reactionner_tags     None

    # 1 = HTTPS entre daemons
    use_ssl               0
    # 1 = vérifie que le certificat correspond au nom du daemon
    hard_ssl_name_check   0

    ## Fonctions avancées
    realm   All
}
