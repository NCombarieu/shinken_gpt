# Modèle de service générique. Ce n'est PAS un service réel (register 0) : les
# services en héritent avec « use generic-service ».
# Voir doc/admin/02-concepts.md (états SOFT/HARD) et
# doc/admin/10-templates-heritage.md.
define service {
    name                            generic-service

    # --- Vérification ---
    check_period                    24x7
    check_interval                  5       ; minutes entre deux checks (état stable)
    retry_interval                  2       ; minutes entre deux checks en état SOFT
    max_check_attempts              3       ; échecs consécutifs avant l'état HARD
    active_checks_enabled           1
    passive_checks_enabled          1
    is_volatile                     0

    # --- Notifications ---
    contact_groups                  admins,users
    notifications_enabled           1
    notification_period             24x7
    notification_interval           1440    ; rappel toutes les 24 h (0 = une seule notification)
    notification_options            w,u,c,r,f,s

    # --- Comportement ---
    event_handler_enabled           0
    flap_detection_enabled          1
    process_perf_data               1

    register                        0
}
