# Host with an NRPE agent: Linux nagios-nrpe-server or Windows NSClient++
# (doc/checks/nrpe.md). The host check asks the agent itself
# (check_nrpe without -c returns the agent version).
define host{
        name                    nrpe-host
        use                     generic-host
        check_command           check_nrpe_alive
        register                0
        }
