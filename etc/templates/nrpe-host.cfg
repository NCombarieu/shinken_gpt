# Host with an NRPE agent: Linux nagios-nrpe-server or Windows NSClient++
# (doc/checks/nrpe.md). The host check asks the agent itself (check_nrpe
# without -c returns the agent version).

# Agent without client certificate check.
define host{
        name                    nrpe-host
        use                     generic-host
        check_command           check_nrpe_alive
        register                0
        }

# Agent requiring Shinken's client certificate (mutual TLS, recommended):
# use check_nrpe_ssl!<alias> for its services.
define host{
        name                    nrpe-ssl-host
        use                     generic-host
        check_command           check_nrpe_ssl_alive
        register                0
        }
