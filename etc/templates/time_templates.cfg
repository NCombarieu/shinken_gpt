# Modèles de fréquence de vérification (register 0).
#
# Un service les ajoute à son modèle principal, par exemple :
#     use    5min_medium
# (chacun hérite déjà de generic-service).
#
# Nommage : <intervalle>_<tolérance>
#   short  : max_check_attempts 1, l'état HARD est atteint dès le premier échec ;
#   medium : max_check_attempts 2, un second échec confirme le problème ;
#   long   : max_check_attempts 6, pour des mesures qui varient beaucoup
#            (pics de charge) et ne doivent alerter que si le problème dure.
# Délai approximatif avant HARD = (max_check_attempts - 1) x retry_interval.
# Voir doc/admin/02-concepts.md (états SOFT et HARD).

# Check toutes les 5 min, HARD dès le premier échec
define service {
    name                    5min_short
    use                     generic-service
    max_check_attempts      1
    check_interval          5
    retry_interval          2
    register                0
}

# Check toutes les 5 min, HARD après environ 3 min de problème
define service {
    name                    5min_medium
    use                     generic-service
    max_check_attempts      2
    check_interval          5
    retry_interval          3
    register                0
}

