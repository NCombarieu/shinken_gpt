# Template for services fed by passive results (doc/checks/ssh-passif.md).
#
# Shinken only runs the freshness check when active checks are disabled
# and passive checks are enabled. When nothing has been received for
# freshness_threshold seconds, check_command runs and puts the service in
# UNKNOWN: a silent client is visible instead of staying "OK" forever.
#
# Note: there is no retention module, so after a restart every passive
# service is stale until its client pushes again (UNKNOWN, not CRITICAL,
# to avoid a wave of alerts).
define service{
        name                            passive-service
        use                             generic-service
        active_checks_enabled           0
        passive_checks_enabled          1
        check_freshness                 1
        freshness_threshold             900     ; seconds; >= 2 x the client push interval
        max_check_attempts              1       ; the client already decided the state
        check_command                   check_passive_stale
        register                        0
        }
