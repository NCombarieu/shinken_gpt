# Host monitored over SNMP (doc/checks/snmp.md).
#   define host{
#       use               snmp-host
#       host_name         sw-core01
#       address           10.0.0.2
#       _SNMP_COMMUNITY   my-ro-community     ; optional, default below
#   }
define host{
        name                    snmp-host
        use                     generic-host
        check_command           check_snmp_alive        ; check_snmp_alive_v3 for v3-only devices
        _SNMP_COMMUNITY         public                  ; change it on every host
        _SNMP_PORT              161
        _SNMP_V3_USER           shinken
        register                0
        }
