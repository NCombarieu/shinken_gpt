# Modèle d'hôte générique. Ce n'est PAS un hôte réel (register 0) : les hôtes
# en héritent avec « use generic-host » et peuvent redéfinir chaque directive.
# Voir doc/admin/10-templates-heritage.md.
define host {
    name                            generic-host

    # --- Vérification ---
    check_command                   check_host_alive
    check_period                    24x7
    check_interval                  5       ; minutes entre deux checks (état stable)
    retry_interval                  1       ; minutes entre deux checks en état SOFT
    max_check_attempts              2       ; échecs consécutifs avant l'état HARD
    active_checks_enabled           1
    passive_checks_enabled          1

    # --- Notifications ---
    # Notifie le groupe admins ; le groupe users voit l'hôte dans l'interface
    # mais ses membres n'ont pas de notification active (voir contacts/).
    contact_groups                  admins,users
    notifications_enabled           1
    notification_period             24x7
    notification_interval           1440    ; rappel toutes les 24 h (0 = une seule notification)
    notification_options            d,u,r,f,s

    # --- Comportement ---
    event_handler_enabled           0
    flap_detection_enabled          1
    process_perf_data               1

    # --- Macros personnalisées héritées par tous les hôtes ---
    # Communauté SNMP par défaut, redéfinissable hôte par hôte.
    _SNMPCOMMUNITY                  $SNMPCOMMUNITYREAD$

    # --- Options avancées (voir doc/admin/) ---
    #maintenance_period             workhours
    #poller_tag                     DMZ
    #realm                          All
    #business_impact                2

    register                        0
}
