# Modèle de contact générique (register 0). Par défaut, un contact reçoit les
# notifications par e-mail, à toute heure (notificationways/email.cfg).
define contact {
    name                            generic-contact
    host_notifications_enabled      1
    service_notifications_enabled   1
    can_submit_commands             1
    notificationways                email
    register                        0
}
