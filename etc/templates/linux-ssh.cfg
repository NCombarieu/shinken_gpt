# Linux host monitored over SSH (doc/checks/ssh-actif.md).
#   define host{
#       use        linux-ssh
#       host_name  srv-web01
#       address    srv-web01.example.lan
#   }
# Override _SSH_USER / _SSH_PORT per host if needed.
define host{
        name                    linux-ssh
        use                     generic-host
        check_command           check_ssh_port
        _SSH_USER               monitoring
        _SSH_PORT               22
        register                0
        }
