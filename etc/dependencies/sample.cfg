# Dépendances : exemples désactivés.
# Voir doc/admin/13-dependances-escalades.md.
#
# Le plus simple est souvent :
#   - pour un hôte : la directive « parents » (topologie réseau) ;
#   - pour un service : la directive « service_dependencies » du service,
#   par exemple « service_dependencies  srv-bdd-01,MySQL ».
# Les objets ci-dessous offrent un contrôle plus fin.
#
# Le service « Application » de srv-app-01 dépend du service « MySQL » de
# srv-bdd-01 : quand MySQL est CRITICAL ou UNKNOWN, l'application n'est plus
# vérifiée (execution_failure_criteria) et ne notifie pas
# (notification_failure_criteria).
#define servicedependency {
#    host_name                       srv-bdd-01
#    service_description             MySQL
#    dependent_host_name             srv-app-01
#    dependent_service_description   Application
#    execution_failure_criteria      c,u
#    notification_failure_criteria   c,u
#    dependency_period               24x7
#}
#
# srv-app-01 dépend de l'hôte srv-bdd-01 : pas de notification pour
# srv-app-01 tant que srv-bdd-01 est DOWN ou UNREACHABLE.
#define hostdependency {
#    host_name                       srv-bdd-01
#    dependent_host_name             srv-app-01
#    notification_failure_criteria   d,u
#    dependency_period               24x7
#}
