# Dossier des « packs » : ensembles prêts à l'emploi de modèles, commandes
# et services pour un type d'équipement (ex. un pack « linux-ssh »).
#
# Tout fichier .cfg placé ici, y compris dans des sous-dossiers, est chargé.
# Le dépôt communautaire historique (shinken.io) n'est plus en service et la
# commande « shinken install » n'est pas disponible dans cette version :
# les packs se copient à la main.
