[workspace]
members = [
    "rust/crates/shinken-config",
    "rust/crates/shinken-core",
    "rust/crates/shinken-engine",
    "rust/crates/shinken-livestatus",
    "rust/crates/shinken-model",
    "rust/crates/shinken-rs",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/NCombarieu/shinken_gpt"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
chrono = "0.4"
chrono-tz = "0.10"
nix = { version = "0.29", features = ["signal", "process"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
