[package]
name = "shinken-arbiter-rs"
version = "2.4.3"
edition = "2021"
authors = ["Shinken Contributors"]
license = "AGPL-3.0-or-later"
description = "High-performance Arbiter daemon for Shinken monitoring (Rust implementation)"

[dependencies]
# Config parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client for daemon communication
reqwest = { version = "0.11", features = ["json"] }
hyper = "0.14"

# File watching for config changes
notify = "6.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Concurrency
parking_lot = "0.12"

# Performance
dashmap = "5.5"  # Concurrent hashmap

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
