name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile all shipped Python sources
        run: python -m compileall -q shinken bin cli modules libexec integration

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install wheel and smoke test
        run: |
          python -m pip install dist/*.whl
          python -c "import shinken; print(shinken.__file__)"
          shinken-arbiter --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install lint tooling
        run: python -m pip install ruff
      - name: Lint fatal errors
        # bottlecore.py is vendored legacy Bottle code.
        run: ruff check shinken bin cli modules libexec integration --select E9,F7,F82 --exclude shinken/webui/bottlecore.py
      - name: Inventory modernization debt
        run: python integration/modernization_audit.py

  compatibility-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest requests
      - name: Run migrated compatibility tests
        run: pytest -ra test/test_macroresolver.py test/test_complex_hostgroups.py

  legacy-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout requests
      - name: Run complete legacy suite
        working-directory: test
        run: pytest -ra --maxfail=1 --timeout=60 --timeout-method=signal --junitxml=../legacy-results.xml
      - name: Upload legacy test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-test-results-${{ matrix.python-version }}
          path: legacy-results.xml
          if-no-files-found: warn
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build rootless container
        run: podman build --tag shinken:test --file Containerfile .
      - name: Smoke test daemon executable
        run: podman run --rm shinken:test shinken-arbiter --version

  distributed-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Deploy Shinken and execute real checks
        run: bash integration/podman-lab.sh
