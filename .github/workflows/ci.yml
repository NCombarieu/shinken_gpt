name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile all Python sources
        run: python -m compileall -q shinken bin

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install lint tooling
        run: python -m pip install ruff
      - name: Lint fatal errors
        run: ruff check shinken bin --select E9,F63,F7,F82

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov
      - name: Tests
        run: pytest -ra

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build rootless container
        run: podman build --tag shinken:test --file Containerfile .
      - name: Smoke test image
        run: podman run --rm shinken:test shinken-arbiter --version
