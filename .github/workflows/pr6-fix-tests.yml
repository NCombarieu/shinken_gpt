name: PR6 fix tests

on:
  push:
    branches: [modernize/podman-python3]

permissions:
  contents: write

jobs:
  restore-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: modernize/podman-python3

      - name: Restore maintenance property coverage and docs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          python - <<'PY'
          from pathlib import Path

          path = Path('test/test_properties_defaults.py')
          text = path.read_text()

          host_old = """        ('maintenance_period', ''),\n        ('business_impact', 2),"""
          host_new = """        ('maintenance_period', ''),\n        ('maintenance_checks_enabled', False),\n        ('maintenance_check_command', ''),\n        ('maintenance_check_period', ''),\n        ('maintenance_check_interval', 0),\n        ('maintenance_retry_interval', 0),\n        ('business_impact', 2),"""
          if host_old not in text:
              raise SystemExit('host maintenance property insertion point not found')
          text = text.replace(host_old, host_new, 1)

          service_old = """        ('maintenance_period', ''),\n        ('duplicate_foreach', ''),"""
          service_new = """        ('maintenance_period', ''),\n        ('maintenance_checks_enabled', False),\n        ('maintenance_check_command', ''),\n        ('maintenance_check_period', ''),\n        ('maintenance_check_interval', 0),\n        ('maintenance_retry_interval', 0),\n        ('duplicate_foreach', ''),"""
          if service_old not in text:
              raise SystemExit('service maintenance property insertion point not found')
          path.write_text(text.replace(service_old, service_new, 1))
          PY

          mkdir -p doc/source/07_advanced
          git show origin/master:doc/source/07_advanced/maintenance-downtime.rst > doc/source/07_advanced/maintenance-downtime.rst

      - name: Install targeted test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout requests

      - name: Run targeted regressions
        working-directory: test
        run: |
          pytest -q \
            test_nohostsched.py \
            test_properties_defaults.py \
            test_property_override.py \
            test_maintenance_check.py \
            test_macroresolver.py \
            --timeout=60

      - name: Commit fixes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr6-fix-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/test_properties_defaults.py doc/source/07_advanced/maintenance-downtime.rst .github/workflows/pr6-fix-tests.yml
          git commit -m "Restore maintenance property coverage and documentation"
          git push origin HEAD:modernize/podman-python3
