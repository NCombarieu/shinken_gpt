name: PR6 autofix

on:
  push:
    branches: [modernize/podman-python3]

permissions:
  contents: write

jobs:
  fix-regressions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: modernize/podman-python3

      - name: Restore regressed core behavior
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master

          git checkout origin/master -- \
            shinken/check.py \
            shinken/objects/host.py \
            shinken/objects/service.py \
            shinken/objects/schedulingitem.py \
            test/shinken_test.py

          python - <<'PY'
          from pathlib import Path
          import subprocess

          macro = Path('shinken/macroresolver.py')
          text = macro.read_text()
          old = 'return time.strftime("%a %d %b %H:%M:%S %Z %Y").decode(\'UTF-8\', \'ignore\')'
          new = 'return time.strftime("%a %d %b %H:%M:%S %Z %Y")'
          if old not in text:
              raise SystemExit('LONGDATETIME regression pattern not found')
          macro.write_text(text.replace(old, new, 1))

          scheduler = Path('shinken/scheduler.py')
          current = scheduler.read_text()
          master = subprocess.check_output(
              ['git', 'show', 'origin/master:shinken/scheduler.py'], text=True
          )
          master_start = master.index('    def get_maintenance_dt_times(self, now, elt):')
          master_end = master.index('    # Main schedule function', master_start)
          restored = master[master_start:master_end]
          branch_start = current.index('    # Check for downtimes start and stop, and register\n    # them if needed\n    def update_downtimes_and_comments(self):')
          branch_end = current.index('    # Main schedule function', branch_start)
          scheduler.write_text(current[:branch_start] + restored + current[branch_end:])

          test_macro = Path('test/test_macroresolver.py')
          test_text = test_macro.read_text()
          marker = "\n\nif __name__ == '__main__':"
          regression = '''\n    def test_longdatetime_macro_is_text(self):\n        mr = self.get_mr()\n        value = mr._get_long_date_time()\n        self.assertIsInstance(value, str)\n        self.assertTrue(value)\n'''
          if 'test_longdatetime_macro_is_text' not in test_text:
              test_macro.write_text(test_text.replace(marker, regression + marker, 1))
          PY

          mkdir -p test/etc/maintenance_check
          git show origin/master:test/test_maintenance_check.py > test/test_maintenance_check.py
          git show origin/master:test/etc/shinken_maintenance_check.cfg > test/etc/shinken_maintenance_check.cfg
          git show origin/master:test/etc/maintenance_check/hosts.cfg > test/etc/maintenance_check/hosts.cfg
          git show origin/master:test/etc/maintenance_check/services.cfg > test/etc/maintenance_check/services.cfg

      - name: Install targeted test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout requests

      - name: Run targeted regression tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q test/test_macroresolver.py test/test_maintenance_check.py --timeout=60 2>&1 | tee pytest-autofix.log

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr6-autofix-diagnostics
          path: pytest-autofix.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit fixes back to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr6-autofix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            shinken/check.py \
            shinken/objects/host.py \
            shinken/objects/service.py \
            shinken/objects/schedulingitem.py \
            shinken/scheduler.py \
            shinken/macroresolver.py \
            test/shinken_test.py \
            test/test_macroresolver.py \
            test/test_maintenance_check.py \
            test/etc/shinken_maintenance_check.cfg \
            test/etc/maintenance_check/hosts.cfg \
            test/etc/maintenance_check/services.cfg \
            .github/workflows/pr6-autofix.yml
          git commit -m "Fix core maintenance and Python 3 regressions"
          git push origin HEAD:modernize/podman-python3
