[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shinken-poller"
version = "2.4.3"
description = "Shinken Poller daemon - executes monitoring checks"
requires-python = ">=3.11"
dependencies = [
  "Bottle>=0.13.4,<0.14",
  "cheroot>=11.1.2,<12",
  "pycurl>=7.45.2",
  "Pyro5>=5.15",
  "six>=1.16,<2",
]

[tool.setuptools]
packages = ["shinken"]
