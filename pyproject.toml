[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Shinken"
dynamic = ["version", "dependencies"]
requires-python = ">=3.11"
description = "Shinken monitoring framework compatible with Nagios configuration and plugins"
readme = "README.rst"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Shinken contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Networking :: Monitoring",
]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:shinken.*",
  "default::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["doc", "inventory", "share"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["B011"]

[tool.coverage.run]
branch = true
source = ["shinken"]

[tool.coverage.report]
show_missing = true
skip_covered = true
